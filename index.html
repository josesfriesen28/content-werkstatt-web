<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Content Werkstatt</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400;1,6..72,500&display=swap">
<style>
/* Content Werkstatt · Werkstatt-Look: dunkles Walnussbraun, Olivgrün, Papier für Notizen.
   Layout: feste Seitenleiste (Projekt, Bereiche), Arbeitsfläche rechts; auf dem Handy Leiste oben + Schublade. */
:root{
 --bg:#15120e;--surface:#1d1914;--surface-2:#252019;--surface-3:#2e2820;--line:#3a3128;--line-2:#4a3f33;
 --text:#ece4d6;--text-2:#cbbfae;--muted:#9a8c7a;--olive:#93a05e;--olive-2:#b2bd7c;--olive-ink:#1b1d10;--olive-soft:rgba(147,160,94,.14);
 --clay:#c08a5c;--clay-soft:rgba(192,138,92,.14);--danger:#d07a62;--danger-soft:rgba(208,122,98,.14);--focus:#c9d38f;
 --n-sand:#2c261d;--n-olive:#262a1c;--n-clay:#30241b;--n-slate:#212527;--n-rose:#2f2222;--n-paper:#e9dfcd;
 --shadow:0 1px 0 rgba(255,255,255,.03) inset,0 12px 30px -18px rgba(0,0,0,.7);
 --f-display:"Newsreader","Iowan Old Style","Palatino Linotype",Georgia,serif;
 --f-body:"Figtree","Segoe UI",system-ui,-apple-system,sans-serif;
 --f-mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,monospace;
 --r:10px;--r-s:7px;color-scheme:dark;
}
:root[data-ui="light"]{
 --bg:#efe9df;--surface:#f8f4ed;--surface-2:#efe8dc;--surface-3:#e6ddce;--line:#d9cebd;--line-2:#c7b9a4;
 --text:#2a221b;--text-2:#4a3e33;--muted:#76695b;--olive:#5d6a2e;--olive-2:#4b5624;--olive-ink:#f7f5ea;--olive-soft:rgba(93,106,46,.12);
 --clay:#94603a;--clay-soft:rgba(148,96,58,.12);--danger:#a94a33;--danger-soft:rgba(169,74,51,.1);--focus:#5d6a2e;
 --n-sand:#f3ead8;--n-olive:#e8ebd6;--n-clay:#f2e1d2;--n-slate:#e3e6e6;--n-rose:#f3dfdb;--n-paper:#2a221b;
 --shadow:0 10px 24px -18px rgba(60,40,20,.45);color-scheme:light}
[hidden]{display:none!important}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 var(--f-body);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
::selection{background:var(--olive-soft)}
h1,h2,h3,h4{margin:0;text-wrap:balance}
a{color:var(--olive-2)}
.mono{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.06em}
.eyebrow{font-family:var(--f-mono);font-size:.68rem;letter-spacing:.14em;text-transform:uppercase;color:var(--olive)}
.muted{color:var(--muted)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ── Rahmen ───────────────────────────────────────────── */
.app{display:grid;grid-template-columns:76px minmax(0,1fr);min-height:100%}
.rail{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;align-items:center;gap:4px;padding:14px 0 12px max(0px,env(safe-area-inset-left,0px));background:var(--surface);border-right:1px solid var(--line);z-index:20}
.rail-logo{font-family:var(--f-display);font-weight:600;font-size:1.35rem;color:var(--text);text-decoration:none;margin-bottom:14px;letter-spacing:-.02em}
.rail-logo i{color:var(--olive-2)}
.ico{width:18px;height:18px;flex:none;color:var(--muted)}
.btn .ico{color:inherit;opacity:.85}
.rail-btn{display:grid;justify-items:center;gap:3px;width:62px;padding:8px 0 6px;border:0;border-radius:10px;background:none;color:var(--muted);font-size:.66rem;font-weight:600;letter-spacing:.02em}
.rail-btn .ico,.rail-btn .theme-ico .ico{width:20px;height:20px}
.rail-btn:hover{background:var(--surface-2);color:var(--text)}
.rail-btn[aria-current="page"]{background:var(--olive-soft);color:var(--olive-2)}
.rail-btn[aria-current="page"] .ico{color:var(--olive-2)}
.rail-btn .ico{color:inherit}
.theme-ico{display:grid}
.rail-sp{flex:1}
.save{display:inline-flex;align-items:center;gap:7px;font-size:.76rem;color:var(--muted);white-space:nowrap;margin-right:4px}
.save i{width:7px;height:7px;border-radius:50%;background:var(--olive)}
.save.warn i{background:var(--clay)}
.save.bad i{background:var(--danger)}
.main{min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;display:flex;align-items:center;gap:12px;min-height:58px;padding-block:9px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:var(--bg);border-bottom:1px solid var(--line)}
@media (min-width:861px){.topbar,.ptabs{padding-left:28px;padding-right:28px}}
.crumbs{min-width:0;display:flex;align-items:center;gap:8px}
.crumb-folder{border:0;background:none;padding:0;color:var(--muted);font-size:.88rem;white-space:nowrap}
.crumb-folder:hover{color:var(--olive-2)}
.crumbs .sep{color:var(--line-2)}
.crumb-title{font-family:var(--f-display);font-size:1.2rem;font-weight:600}
.proj-switch{display:inline-flex;align-items:center;gap:6px;min-width:0;padding:5px 10px;border-radius:8px;border:1px solid var(--line-2);background:var(--surface);color:var(--text)}
.proj-switch b{font-family:var(--f-display);font-size:1.08rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:38vw}
.proj-switch:hover{border-color:var(--olive)}
.proj-switch .ico{width:16px;height:16px}
button.status-pill{border:0;cursor:pointer}
.top-actions{margin-left:auto;display:flex;gap:6px;align-items:center;flex-wrap:nowrap}
body.no-project .proj-only{display:none!important}
.ptabs{position:sticky;top:calc(env(safe-area-inset-top,0px) + 58px);z-index:5;display:flex;gap:2px;overflow-x:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:var(--bg);border-bottom:1px solid var(--line);scrollbar-width:none}
.ptabs button{flex:none;display:flex;align-items:baseline;gap:6px;padding:11px 12px 10px;border:0;border-bottom:2px solid transparent;background:none;color:var(--muted);font-size:.9rem}
.ptabs button:hover{color:var(--text)}
.ptabs button[aria-current="page"]{color:var(--text);border-bottom-color:var(--olive)}
.ptabs i{font-style:normal;font-family:var(--f-mono);font-size:.68rem;color:var(--muted)}
.menu{max-height:min(70vh,520px);overflow-y:auto}
.menu-h{padding:8px 10px 4px;font-family:var(--f-mono);font-size:.64rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.menu button[aria-current]{color:var(--olive-2);font-weight:600}
.menu button[aria-current]::after{content:"✓";margin-left:auto}
.view{padding-block:22px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));width:100%;max-width:1320px;margin:0 auto}
@media (min-width:861px){.view{padding-left:28px;padding-right:28px}}

/* ── Bedienelemente ────────────────────────────────────── */
.btn{display:inline-flex;align-items:center;gap:7px;padding:7px 12px;border-radius:var(--r-s);border:1px solid var(--line-2);background:var(--surface-2);color:var(--text);font-size:.86rem;line-height:1.2;white-space:nowrap}
.btn:hover{border-color:var(--olive);background:var(--surface-3)}
.btn:disabled{opacity:.4;cursor:default}
.btn.primary{background:var(--olive);border-color:var(--olive);color:var(--olive-ink);font-weight:600}
.btn.primary:hover{background:var(--olive-2)}
.btn.ghost{background:none;border-color:transparent;color:var(--text-2)}
.btn.ghost:hover{background:var(--surface-2);border-color:var(--line)}
.btn.danger{color:var(--danger)}
.btn.danger:hover{border-color:var(--danger);background:var(--danger-soft)}
.btn.sm{padding:4px 8px;font-size:.78rem}
.icon-btn{display:inline-grid;place-items:center;width:30px;height:30px;padding:0;border-radius:6px;border:1px solid transparent;background:none;color:var(--muted)}
.icon-btn:hover{background:var(--surface-3);color:var(--text);border-color:var(--line)}
.icon-btn.on{color:var(--olive-2)}
.field{display:grid;gap:5px}
.field>span{font-size:.74rem;color:var(--muted);font-weight:600;letter-spacing:.02em}
.input,.select,.textarea{width:100%;padding:9px 11px;border-radius:var(--r-s);border:1px solid var(--line);background:var(--surface-2);color:var(--text)}
.input:focus,.select:focus,.textarea:focus{outline:none;border-color:var(--olive);box-shadow:0 0 0 3px var(--olive-soft)}
.textarea{resize:vertical;min-height:80px;line-height:1.55}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;border:1px solid var(--line-2);background:none;color:var(--text-2);font-size:.78rem}
.chip:hover{border-color:var(--olive)}
.chip[aria-pressed="true"]{background:var(--olive-soft);border-color:var(--olive);color:var(--text)}
.tag{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:999px;background:var(--surface-3);color:var(--text-2);font-size:.74rem}
.tag button{border:0;background:none;color:var(--muted);padding:0 0 0 2px;font-size:.9rem;line-height:1}
.kind{font-family:var(--f-mono);font-size:.66rem;letter-spacing:.08em;text-transform:uppercase;padding:2px 7px;border-radius:4px;background:var(--surface-3);color:var(--text-2)}
.kind.Methode{background:var(--olive-soft);color:var(--olive-2)}
.kind.Checkliste{background:var(--clay-soft);color:var(--clay)}
.kind.Übung{background:rgba(120,140,150,.16);color:#9fb3bb}
.kind.Reflexion{background:rgba(170,120,120,.16);color:#c49b93}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.panel h3{font-family:var(--f-display);font-weight:600;font-size:1.15rem}
.panel-head{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.panel-head .btn,.panel-head .icon-btn{margin-left:auto}
.empty{padding:18px;border:1px dashed var(--line-2);border-radius:var(--r);color:var(--muted);font-size:.88rem;text-align:center}
.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:18px}
.toolbar .grow{flex:1 1 220px;min-width:0}
.search{display:flex;align-items:center;gap:8px;padding:0 10px;border:1px solid var(--line);border-radius:var(--r-s);background:var(--surface)}
.search input{flex:1;min-width:0;border:0;background:none;padding:8px 0;outline:none}
.seg{display:inline-flex;padding:3px;border-radius:9px;background:var(--surface-2);border:1px solid var(--line)}
.seg button{border:0;background:none;padding:6px 12px;border-radius:7px;color:var(--text-2);font-size:.84rem}
.seg button[aria-pressed="true"]{background:var(--surface-3);color:var(--text);box-shadow:0 0 0 1px var(--line-2)}

/* ── Seitenkopf ────────────────────────────────────────── */
.vhead{display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px 24px;margin-bottom:20px}
.vhead .eyebrow{margin-bottom:6px}
.vhead h1{font-family:var(--f-display);font-weight:500;font-size:clamp(1.6rem,1.3rem + 1vw,2.15rem);line-height:1.08;letter-spacing:-.015em}
.vhead h1 em{font-style:italic;color:var(--olive-2)}
.vhead p{margin:8px 0 0;color:var(--text-2);max-width:62ch}
.vhead .actions{margin-left:auto;display:flex;flex-wrap:wrap;gap:8px}

/* ── Übersicht ─────────────────────────────────────────── */
.title-input{width:100%;border:0;background:none;padding:0;font-family:var(--f-display);font-weight:500;font-size:clamp(1.9rem,1.4rem + 1.8vw,2.8rem);line-height:1.1;letter-spacing:-.015em;color:var(--text)}
.title-input:focus{outline:none;box-shadow:0 2px 0 var(--olive)}
.summary-input{width:100%;margin-top:10px;border:0;background:none;resize:none;color:var(--text-2);font-size:1.02rem;line-height:1.5;padding:0}
.summary-input:focus{outline:none}
.status-track{display:flex;flex-wrap:wrap;gap:4px;margin:20px 0 4px}
.status-track button{flex:1 1 90px;padding:9px 8px 8px;border:0;border-top:3px solid var(--line-2);background:none;color:var(--muted);font-size:.78rem;text-align:left}
.status-track button.done{border-top-color:var(--olive);color:var(--text-2)}
.status-track button[aria-pressed="true"]{border-top-color:var(--olive-2);color:var(--text);font-weight:600}
.dash{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:16px;margin-top:22px}
.dash>.panel{grid-column:span 6;min-width:0}
.dash>.panel.wide{grid-column:span 12}
.dash>.panel.third{grid-column:span 4}
@media (max-width:1100px){.dash>.panel.third{grid-column:span 6}}
@media (max-width:760px){.dash>.panel,.dash>.panel.third{grid-column:span 12}}
.meta-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.phase-bars{display:grid;gap:10px}
.phase-bar{display:grid;grid-template-columns:110px minmax(0,1fr) 54px;align-items:center;gap:12px;padding:6px 4px;border:0;background:none;border-radius:6px;text-align:left;color:var(--text-2)}
.phase-bar:hover{background:var(--surface-2)}
.bar{height:6px;border-radius:3px;background:var(--surface-3);overflow:hidden}
.bar i{display:block;height:100%;background:var(--olive);border-radius:3px}
.phase-bar .mono{text-align:right;color:var(--muted)}
.mini-list{display:grid;gap:6px;margin:0;padding:0;list-style:none}
.mini-list li{display:flex;align-items:flex-start;gap:10px;padding:8px 10px;border-radius:var(--r-s);background:var(--surface-2)}
.mini-list li.done span{color:var(--muted);text-decoration:line-through}
.mini-list input[type=checkbox]{margin-top:4px;accent-color:var(--olive)}
.mini-list span{flex:1;min-width:0;overflow-wrap:anywhere}
.add-row{display:flex;gap:6px;margin-top:10px}
.add-row .input{flex:1;min-width:0}
.tag-editor{display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:6px 8px;border:1px solid var(--line);border-radius:var(--r-s);background:var(--surface-2)}
.tag-editor input{flex:1;min-width:90px;border:0;background:none;outline:none;padding:3px}
.kpis{display:flex;flex-wrap:wrap;gap:22px;margin-top:6px}
.kpi b{display:block;font-family:var(--f-display);font-size:1.7rem;font-weight:500;line-height:1}
.kpi span{font-size:.76rem;color:var(--muted)}

/* ── Roadmap ───────────────────────────────────────────── */
.phase-tabs{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line);margin-bottom:18px}
.phase-tabs button{flex:none;display:grid;gap:2px;padding:10px 16px 12px;border:0;border-bottom:2px solid transparent;background:none;color:var(--muted);text-align:left}
.phase-tabs button b{font-family:var(--f-display);font-size:1.12rem;font-weight:500;color:var(--text-2)}
.phase-tabs button[aria-selected="true"]{border-bottom-color:var(--olive)}
.phase-tabs button[aria-selected="true"] b{color:var(--text)}
.phase-intro{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;margin-bottom:18px;color:var(--text-2)}
.phase-intro .lib-link{margin-left:auto}
.lib-link{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:999px;border:1px solid var(--line-2);background:none;color:var(--olive-2);font-size:.8rem}
.lib-link:hover{border-color:var(--olive);background:var(--olive-soft)}
.board{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,330px),1fr));gap:18px;align-items:start}
.group{position:relative;display:flex;flex-direction:column;gap:10px;padding:14px;border-radius:12px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);min-width:0}
.group.point{border-color:color-mix(in srgb,var(--olive) 45%,var(--line))}
.group.point .g-title::before{content:"";display:inline-block;width:8px;height:8px;margin-right:8px;border-radius:2px;background:var(--olive);vertical-align:middle}
.group.custom{border-style:dashed}
.g-head{display:flex;align-items:center;gap:6px;min-width:0}
.g-title{flex:1;min-width:0;font-family:var(--f-display);font-weight:600;font-size:1.06rem;line-height:1.25;overflow-wrap:anywhere}
.g-kind{font-family:var(--f-mono);font-size:.62rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.g-count{font-family:var(--f-mono);font-size:.7rem;color:var(--muted)}
.cards{display:grid;gap:8px}
.card{position:relative;display:grid;gap:4px;padding:10px 10px 8px 12px;border-radius:8px;background:var(--n-sand);border:1px solid color-mix(in srgb,var(--line) 70%,transparent)}
.card[data-color="olive"]{background:var(--n-olive)}
.card[data-color="clay"]{background:var(--n-clay)}
.card[data-color="slate"]{background:var(--n-slate)}
.card[data-color="rose"]{background:var(--n-rose)}
.card.match{box-shadow:0 0 0 2px var(--olive)}
.c-head{display:flex;align-items:center;gap:4px;min-width:0}
.c-title{flex:1;min-width:0;font-size:.74rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--text-2);overflow-wrap:anywhere}
.c-tools{display:flex;opacity:.35;transition:opacity .15s}
.card:hover .c-tools,.card:focus-within .c-tools{opacity:1}
.c-tools .icon-btn{width:24px;height:24px}
.card textarea{width:100%;min-height:42px;padding:2px 0;border:0;background:none;resize:none;color:var(--text);line-height:1.5;overflow:hidden}
.card textarea:focus{outline:none}
.card textarea::placeholder{color:var(--muted);opacity:.85}
.c-foot{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:.72rem;color:var(--muted)}
.link-badge{display:inline-flex;align-items:center;gap:5px;padding:1px 7px;border-radius:999px;background:var(--olive-soft);color:var(--olive-2);border:0;font-size:.7rem}
.link-badge.off{background:var(--clay-soft);color:var(--clay)}
.src-badge{display:inline-flex;gap:4px;padding:1px 7px;border-radius:999px;background:var(--surface-3);color:var(--text-2);font-size:.7rem;border:0}
.g-foot{display:flex;flex-wrap:wrap;gap:6px}
.add-tile{display:grid;align-content:center;justify-items:start;gap:8px;min-height:140px;padding:18px;border-radius:12px;border:1px dashed var(--line-2);color:var(--muted)}
.add-tile .eyebrow{color:var(--muted)}
.tpl-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,210px),1fr));gap:10px}
.tpl{display:grid;align-content:start;gap:4px;padding:12px 14px;border-radius:var(--r-s);border:1px solid var(--line);background:var(--surface-2);text-align:left;color:var(--text)}
.tpl:hover,.tpl:focus-visible{border-color:var(--olive);background:var(--olive-soft)}
.tpl b{font-family:var(--f-display);font-size:1.05rem;font-weight:600}
.tpl span{font-size:.8rem;color:var(--text-2)}
.tpl small{font-family:var(--f-mono);font-size:.64rem;color:var(--muted);letter-spacing:.02em}
details summary{list-style:none}
details summary::before{content:'+ ';}
details[open] summary::before{content:'– '}
.collapsed .cards,.collapsed .g-foot{display:none}
.menu{position:fixed;z-index:50;min-width:210px;padding:6px;border-radius:10px;background:var(--surface-3);border:1px solid var(--line-2);box-shadow:0 18px 40px -12px rgba(0,0,0,.6)}
.menu button{display:flex;align-items:center;gap:10px;width:100%;padding:7px 10px;border:0;border-radius:6px;background:none;color:var(--text);text-align:left;font-size:.86rem}
.menu button:hover{background:var(--surface-2)}
.menu hr{border:0;border-top:1px solid var(--line-2);margin:5px 4px}
.menu .swatches{display:flex;gap:6px;padding:6px 10px}
.menu .swatches button{width:22px;height:22px;padding:0;border-radius:50%;border:1px solid var(--line-2)}
.step-wrap{max-width:760px;margin:0 auto}
.step-wrap .group{padding:24px}
.step-nav{display:flex;align-items:center;gap:10px;margin:18px 0}
.step-nav .mono{margin:0 auto;color:var(--muted)}
.hint{font-size:.78rem;color:var(--muted)}

/* ── Recherche ─────────────────────────────────────────── */
.two{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:980px){.two{grid-template-columns:minmax(0,1fr)}}

/* ── Manuskript ────────────────────────────────────────── */
.ms{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:22px;align-items:start}

.ms-paper textarea:focus{outline:none}
.ms-stats{display:flex;flex-wrap:wrap;gap:6px 18px;margin-bottom:14px;font-size:.8rem;color:var(--muted)}

.outline .sub button{padding-left:22px;font-size:.8rem;color:var(--muted)}

/* ── Bibliothek ────────────────────────────────────────── */
.lib-intro{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:18px;margin-bottom:26px}
@media (max-width:900px){.lib-intro{grid-template-columns:minmax(0,1fr)}}
.lead{font-family:var(--f-display);font-size:1.28rem;line-height:1.45;color:var(--text)}
.steps6{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:14px 0 0;padding:0;list-style:none;counter-reset:s}
.steps6 li{counter-increment:s;padding:10px;border-radius:8px;background:var(--surface-2);font-size:.82rem;color:var(--text-2)}
.steps6 li::before{content:counter(s);display:block;font-family:var(--f-display);font-size:1.3rem;color:var(--olive-2);line-height:1.1}
.cycle{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:10px}
.cycle span{padding:6px 12px;border-radius:999px;background:var(--surface-2);font-size:.84rem}
.cycle i{font-style:normal;color:var(--olive)}
.lib-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:14px}
.entry{display:grid;align-content:start;gap:8px;padding:16px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line);text-align:left;color:var(--text)}
.entry:hover{border-color:var(--olive)}
.entry h3{font-family:var(--f-display);font-weight:600;font-size:1.12rem;line-height:1.25}
.entry p{margin:0;font-size:.88rem;color:var(--text-2)}
.entry .e-meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.entry .in-proj{margin-left:auto;font-size:.72rem;color:var(--olive-2)}
.cat-head{display:flex;align-items:baseline;gap:12px;margin:30px 0 12px}
.cat-head h2{font-family:var(--f-display);font-weight:500;font-size:1.5rem}
.cat-head p{margin:0;color:var(--muted);font-size:.86rem}
dialog{max-width:min(760px,calc(100vw - 32px));width:100%;max-height:calc(100vh - 48px);padding:0;border:1px solid var(--line-2);border-radius:14px;background:var(--surface);color:var(--text);box-shadow:0 30px 80px -20px rgba(0,0,0,.7)}
dialog::backdrop{background:rgba(10,8,6,.62);backdrop-filter:blur(2px)}
.dlg{display:grid;gap:16px;padding:24px;overflow-y:auto;max-height:calc(100vh - 50px)}
.dlg-head{display:flex;align-items:flex-start;gap:12px}
.dlg-head h2{font-family:var(--f-display);font-weight:500;font-size:1.7rem;line-height:1.15}

.dlg-actions{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end}
.entry-body h4{margin:6px 0 6px;font-family:var(--f-mono);font-size:.68rem;letter-spacing:.14em;text-transform:uppercase;color:var(--olive)}
.entry-body p{margin:0 0 10px;color:var(--text-2);line-height:1.6;max-width:68ch}
.entry-body ul{margin:0 0 10px;padding-left:20px;color:var(--text-2);line-height:1.6}
.entry-body .short{font-family:var(--f-display);font-size:1.2rem;line-height:1.45;color:var(--text)}
.caution{padding:12px 14px;border-radius:8px;background:var(--clay-soft);border-left:3px solid var(--clay);font-size:.86rem;color:var(--text-2)}
.caution b{color:var(--clay)}
.srcs{display:flex;flex-wrap:wrap;gap:6px}
.srcs span{font-size:.74rem;padding:3px 8px;border-radius:6px;background:var(--surface-2);color:var(--text-2)}
.srcs b{font-family:var(--f-mono);font-weight:500;color:var(--muted);margin-right:4px}
.module{display:grid;gap:10px}
.module .checks{display:grid;gap:4px;margin:0;padding:0;list-style:none}
.module .checks label{display:flex;gap:10px;align-items:flex-start;padding:6px 8px;border-radius:6px;cursor:pointer}
.module .checks label:hover{background:var(--surface-2)}
.module .checks input{margin-top:4px;accent-color:var(--olive)}
.module .checks .done span{color:var(--muted);text-decoration:line-through}
.mod-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,360px),1fr));gap:16px}

/* ── Export ────────────────────────────────────────────── */
.exp{display:grid;grid-template-columns:330px minmax(0,1fr);gap:22px;align-items:start}
@media (max-width:1000px){.exp{grid-template-columns:minmax(0,1fr)}}
.exp-side{display:grid;gap:16px;position:sticky;top:76px}
@media (max-width:1000px){.exp-side{position:static}}
.variant{display:grid;gap:3px;width:100%;padding:12px 14px;border-radius:var(--r-s);border:1px solid var(--line);background:var(--surface-2);text-align:left;color:var(--text)}
.variant span{font-size:.8rem;color:var(--muted)}
.variant[aria-pressed="true"]{border-color:var(--olive);background:var(--olive-soft)}
.variant b{font-family:var(--f-display);font-size:1.08rem;font-weight:600}
.formats{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.formats .btn{justify-content:flex-start;padding:10px 12px;white-space:normal;flex-direction:column;align-items:flex-start;gap:2px}
.formats .btn small{color:var(--muted);font-size:.72rem}
.formats .btn.primary small{color:inherit;opacity:.8}
.checkline{display:flex;gap:8px;align-items:center;font-size:.86rem;color:var(--text-2)}
.checkline input{accent-color:var(--olive)}
.preview{background:#f8f4ec;color:#2a221b;border-radius:10px;padding:clamp(18px,4vw,52px);box-shadow:var(--shadow);min-width:0;font-family:Georgia,"Times New Roman",serif}
.preview .doc-cover{margin:-1px -1px 30px;padding:34px 30px;border-radius:8px;background:#231c16;color:#efe7da;border-top:5px solid #6b7340}
.preview .doc-kicker{font:600 .7rem/1 var(--f-mono);letter-spacing:.18em;text-transform:uppercase;color:#a3aa72;margin-bottom:16px}
.preview .doc-cover h1{font-family:var(--f-display);font-weight:600;font-size:2rem;line-height:1.12}
.preview .doc-sub{font-style:italic;color:#cdbfa9;margin:10px 0 0}
.preview .doc-meta,.preview .doc-date{font:.82rem/1.5 var(--f-body);color:#bfb3a0;margin-top:12px}
.preview .doc-tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.preview .doc-tags span{font:.74rem var(--f-body);padding:2px 8px;border:1px solid #6b7340;border-radius:3px}
.preview .doc-h1{font-family:var(--f-display);font-size:1.55rem;font-weight:600;margin:34px 0 4px;padding-bottom:8px;border-bottom:1.5px solid #6b7340}
.preview .doc-kick{font-style:italic;color:#7a6e62;margin:6px 0 10px}
.preview .doc-h2{font-family:var(--f-display);font-size:1.18rem;font-weight:600;color:#4a3b2e;margin:22px 0 6px}
.preview .doc-h3{font:700 .9rem var(--f-body);color:#6b7340;margin:14px 0 4px}
.preview .doc-field{margin:10px 0}

.preview .doc-value{font:.92rem/1.5 var(--f-body)}
.preview .doc-value.is-empty{font-style:italic;color:#a39788}
.preview .doc-refs{font:italic .76rem var(--f-body);color:#7a6e62}
.preview p{line-height:1.65;margin:0 0 12px}
.preview .doc-muted{font:italic .82rem var(--f-body);color:#7a6e62}
.preview blockquote{margin:12px 0;padding-left:14px;border-left:2px solid #6b7340;font-style:italic;color:#4a3b2e}
.preview .doc-note{margin:14px 0;padding:10px 14px;background:#efe8dc;border-left:3px solid #6b7340;font:.84rem/1.5 var(--f-body);color:#4a3b2e}
.preview ul,.preview ol{font:.92rem/1.6 var(--f-body);padding-left:22px}
.preview .doc-checks{list-style:none;padding:0}
.preview .doc-checks li{display:flex;gap:8px}
.preview .doc-checks span{color:#6b7340}
.preview .doc-checks .done{color:#7a6e62}
.doc-table{overflow-x:auto}
.preview table,.rtable{width:100%;border-collapse:collapse;font:.86rem/1.45 var(--f-body)}
.preview th{background:#4a3b2e;color:#efe7da;text-align:left;padding:7px 9px}
.preview td{padding:7px 9px;border-bottom:1px solid #d8cfc0;vertical-align:top}
.rtable th{position:sticky;top:0;text-align:left;padding:8px 10px;background:var(--surface-3);font-size:.76rem;color:var(--text-2)}
.rtable td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top;white-space:pre-wrap}
.rtable td:first-child{color:var(--muted);white-space:nowrap}
.table-wrap{overflow:auto;max-height:70vh;border:1px solid var(--line);border-radius:var(--r)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);z-index:80;display:flex;gap:12px;align-items:center;padding:10px 14px;border-radius:10px;background:var(--surface-3);border:1px solid var(--line-2);box-shadow:0 14px 34px -14px rgba(0,0,0,.7);opacity:0;pointer-events:none;transition:.2s;font-size:.88rem;max-width:calc(100vw - 32px)}
.toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.trash-item{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;background:var(--surface-2)}
.trash-item b{flex:1;min-width:0}

/* ── Handy ─────────────────────────────────────────────── */
@media (max-width:860px){
 .app{grid-template-columns:minmax(0,1fr)}
 .rail{position:fixed;top:auto;bottom:0;left:0;right:0;height:auto;flex-direction:row;justify-content:space-around;padding:4px max(8px,env(safe-area-inset-right,0px)) calc(4px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px));border-right:0;border-top:1px solid var(--line)}
 .rail-logo,.rail-sp{display:none}
 .rail-btn{width:auto;flex:1}
 .main{padding-bottom:calc(64px + env(safe-area-inset-bottom,0px))}
 .save span{display:none}
 .proj-switch b{max-width:46vw}
 .crumb-folder,.crumbs .sep{display:none}
 #undo,#redo{display:none}
 .top-actions .label{display:none}
 .notes{columns:1}
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ── Start / Ordner ───────────────────────────────────── */
.start-top{display:grid;grid-template-columns:minmax(0,2fr) minmax(260px,1fr);gap:18px;align-items:start;margin-bottom:26px}
@media (max-width:1000px){.start-top{grid-template-columns:minmax(0,1fr)}}
.recent{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,230px),1fr));gap:14px}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,250px),1fr));gap:12px}
.pcard{position:relative;display:grid;align-content:start;gap:10px;padding:16px;border-radius:12px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);min-width:0;transition:border-color .15s,transform .15s}
.pcard:hover{border-color:var(--olive)}
.pcard.current{border-color:color-mix(in srgb,var(--olive) 60%,var(--line))}
.pcard.big{background:linear-gradient(160deg,var(--surface-2),var(--surface))}
.pcard.dragging{opacity:.45}
.pcard-open{position:absolute;inset:0;border:0;background:none;border-radius:12px;z-index:0}
.pcard>*:not(.pcard-open){position:relative;z-index:1;pointer-events:none}
.pcard .icon-btn,.pcard .pcard-top{pointer-events:auto}
.pcard-top{display:flex;align-items:center;gap:8px;font-size:.78rem}
.pcard-top .icon-btn{margin-left:auto}
.pcard h3{font-family:var(--f-display);font-weight:600;font-size:1.15rem;line-height:1.25;overflow-wrap:anywhere}
.pcard.big h3{font-size:1.35rem}
.pcard p{margin:0;font-size:.86rem;color:var(--text-2)}
.pcard-bar{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center}
.pcard-meta{display:flex;flex-wrap:wrap;justify-content:space-between;gap:6px;font-size:.74rem;color:var(--muted)}
.pcard-meta .soon{color:var(--clay)}.pcard-meta .late{color:var(--danger);font-weight:600}
.status-pill{padding:2px 9px;border-radius:999px;font-size:.72rem;font-weight:600;background:var(--surface-3);color:var(--text-2)}
.status-pill[data-tone="research"]{background:rgba(120,140,150,.18);color:#9fb3bb}
.status-pill[data-tone="structure"],.status-pill[data-tone="draft"]{background:var(--clay-soft);color:var(--clay)}
.status-pill[data-tone="polish"]{background:var(--olive-soft);color:var(--olive-2)}
.status-pill[data-tone="done"]{background:var(--olive);color:var(--olive-ink)}
.pnew{display:flex;align-items:center;justify-content:center;gap:8px;min-height:120px;border:1px dashed var(--line-2);border-radius:12px;background:none;color:var(--muted);font-size:.86rem}
.pnew:hover{border-color:var(--olive);color:var(--text)}
.folder{margin-top:26px;padding:6px;border-radius:14px;border:1px solid transparent;transition:border-color .15s,background .15s}
.folder.drop-on{border-color:var(--olive);background:var(--olive-soft)}
.folder-head{display:flex;align-items:center;gap:10px;margin:0 0 12px}
.folder-head h2{font-family:var(--f-display);font-weight:500;font-size:1.45rem}
.folder-head .icon-btn:first-child{color:var(--olive-2)}
.folder.closed .pgrid{display:none}
.link-btn{border:0;background:none;padding:0;color:var(--text);font-weight:600;text-align:left}
.link-btn:hover{color:var(--olive-2);text-decoration:underline}
/* ── Präsentieren ─────────────────────────────────────── */
body.presenting{overflow:hidden}
.present{position:fixed;inset:0;z-index:60;display:flex;flex-direction:column;background:var(--bg);color:var(--text);padding-top:env(safe-area-inset-top,0px);outline:none}
.pres-bar{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line);background:var(--surface)}
.pres-title{display:grid;min-width:0}
.pres-title b{font-family:var(--f-display);font-size:1.15rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:40vw}
.pres-tools{margin-left:auto;display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.pres-body{flex:1;overflow:auto;padding-block:24px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

.pres-gtitle{font-family:var(--f-display);font-weight:600;font-size:1.2rem;line-height:1.25}
.pcardnote{display:grid;gap:4px;padding:12px 14px;border-radius:8px;background:var(--n-sand);box-shadow:0 1px 0 rgba(0,0,0,.08)}
.pcardnote[data-color="olive"]{background:var(--n-olive)}.pcardnote[data-color="clay"]{background:var(--n-clay)}.pcardnote[data-color="slate"]{background:var(--n-slate)}.pcardnote[data-color="rose"]{background:var(--n-rose)}

@media (max-width:860px){.pres-title b{max-width:70vw}.pres-tools .checkline{display:none}}
.btn.primary .ico{color:currentColor}

/* ── 3.3: Roadmap-Kopf ────────────────────────────────── */
.stepper{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:12px}
@media (max-width:700px){.stepper{grid-template-columns:repeat(2,minmax(0,1fr))}}
.step-btn{display:grid;gap:7px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:none;color:var(--text-2);text-align:left}
.step-btn:hover{border-color:var(--line-2);background:var(--surface)}
.step-btn[aria-selected="true"]{border-color:var(--olive);background:var(--olive-soft);color:var(--text)}
.step-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.step-h b{font-family:var(--f-display);font-size:1.05rem;font-weight:600}
.step-h .mono{color:var(--muted)}
.bar.mini{display:inline-block;width:80px;vertical-align:middle;margin-right:8px}
.rm-tools{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;margin-bottom:16px}
.rm-desc{margin:0;color:var(--text-2);font-size:.88rem;max-width:62ch}
.rm-desc b{color:var(--text);font-weight:600}
.rm-sp{flex:1}
.search.sm{padding:0 8px;min-width:150px;flex:0 1 200px}
.search.sm input{padding:5px 0;font-size:.84rem}
.search.sm .ico{width:15px;height:15px}
.open-fields{display:flex;align-items:flex-start;gap:8px;width:100%;padding:8px 10px;border-radius:8px;border:1px dashed var(--line-2);background:none;color:var(--muted);font-size:.8rem;text-align:left}
.open-fields .ico{width:15px;height:15px;flex:none;margin-top:1px}
.open-fields b{color:var(--text-2);font-weight:600}
.open-fields:hover{border-color:var(--olive);color:var(--text)}
.board{grid-template-columns:repeat(auto-fill,minmax(min(100%,270px),1fr));gap:14px}
.group{padding:12px;gap:8px}
.card{padding:8px 10px 7px 11px}
.add-tile{min-height:100px}
/* ── 3.3: Start ───────────────────────────────────────── */
.vhead.compact{align-items:center}
.start-bar{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin:6px 0 12px}
.folder-chips{flex:1 1 400px}
.folder-chips .chip .ico{width:14px;height:14px}
.chip.ghost{border-style:dashed;color:var(--muted)}
.chip.drop-on,.folder-row.drop-on td{background:var(--olive-soft)!important;border-color:var(--olive)}
.plist{max-height:none;background:var(--surface)}
.ptable{width:100%;border-collapse:collapse;font-size:.88rem}
.ptable th{position:sticky;top:0;text-align:left;padding:0;background:var(--surface-2);border-bottom:1px solid var(--line);z-index:1}
.ptable th button{width:100%;padding:9px 12px;border:0;background:none;text-align:left;font-size:.72rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.ptable th button.on,.ptable th button:hover{color:var(--text)}
.ptable td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
.ptable tr[data-pcard]:hover td{background:var(--surface-2)}
.ptable tr.current td:first-child{box-shadow:inset 3px 0 0 var(--olive)}
.ptable tr.dragging{opacity:.4}
.row-title{border:0;background:none;padding:0;font-family:var(--f-display);font-size:1.04rem;font-weight:600;color:var(--text);text-align:left}
.row-title:hover{color:var(--olive-2)}
.row-sub{font-size:.76rem;color:var(--muted);margin-top:2px;max-width:46ch;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ptable td.soon{color:var(--clay)}.ptable td.late{color:var(--danger);font-weight:600}
.ptable td:last-child{width:44px;text-align:right}
.folder-row td{padding:14px 12px 6px;background:var(--surface);border-bottom:1px solid var(--line)}
.fr{display:flex;align-items:center;gap:8px}
.fr b{font-family:var(--f-display);font-size:1.15rem;font-weight:600;color:var(--olive-2)}
.fh-ico{color:var(--olive-2)}
.fr-sp{flex:1}
.empty-row{padding:14px 12px;font-size:.84rem}
.muted.soon{color:var(--clay)}.muted.late{color:var(--danger)}
@media (max-width:760px){.ptable th:nth-child(2),.ptable td:nth-child(2),.ptable th:nth-child(6),.ptable td:nth-child(6){display:none}}
@media (max-width:520px){.ptable th:nth-child(4),.ptable td:nth-child(4){display:none}}
@media (max-width:860px){.toast{bottom:calc(76px + env(safe-area-inset-bottom,0px))}}

<script>
/* Shared data model: flexible groups, cards, and explicit one-way content links. */
(function(root){
'use strict';
const uid=()=>crypto.randomUUID();
const clone=x=>JSON.parse(JSON.stringify(x));
const phases=[{id:'strategy',name:'Strategie',title:'Die Richtung festlegen.',desc:'Thema, Wirkung und die Menschen, die du erreichen möchtest.'},{id:'audience',name:'Zuhörer',title:'Dein Publikum verstehen.',desc:'Eine Gruppe pro Zielgruppe. Danach sammelst du die gemeinsamen Schlüsselpunkte.'},{id:'body',name:'Hauptteil',title:'Deine Botschaft schärfen.',desc:'Jeder Hauptpunkt bildet mit seinen Argumenten eine Einheit. So viele, wie du brauchst.'},{id:'route',name:'Wegweiser',title:'Alles zusammenführen.',desc:'Von der Eröffnung über deine Punkte bis zum konkreten nächsten Schritt.'}];
function card(title,hint='',value='',extra={}){return{id:uid(),title,hint,value,color:'yellow',...extra}}
function group(title,kind='custom',cards=[],extra={}){return{id:uid(),title,kind,cards,...extra}}
function groups(p,phase){return p.phases[phase]}
function findGroup(p,id){for(const phase of phases){const g=p.phases[phase.id].find(g=>g.id===id);if(g)return{group:g,phase:phase.id}}}
function findCard(p,id){for(const phase of phases)for(const g of p.phases[phase.id]){const c=g.cards.find(c=>c.id===id);if(c)return{card:c,group:g,phase:phase.id}}}
function keyLines(s){return s.split(/\n/).map(s=>s.replace(/^\s*(?:[-*•]|\d+[.)])\s*/,'').trim()).filter(Boolean)}
function value(p,c,seen=new Set()){if(!c)return'';if(seen.has(c.id))return c.value||'';seen.add(c.id);if(c.source&&!c.detached){const s=findCard(p,c.source);if(s){const v=value(p,s.card,seen);return Number.isInteger(c.sourceLine)?keyLines(v)[c.sourceLine]||'':v}}return c.value||''}
function edit(p,id,v){const f=findCard(p,id);if(!f)return;f.card.value=v;if(f.card.source)f.card.detached=true}
function relink(p,id){const f=findCard(p,id);if(f?.card.source&&findCard(p,f.card.source))f.card.detached=false}
function addAudience(p,index){const entity=uid(),n=groups(p,'audience').filter(g=>g.kind==='audience').length+1;
 const s=group('Zielgruppe '+n,'audience-strategy',[
 card('Zielgruppe','Wer gehört zu dieser Gruppe?','',{role:'audience-name'}),card('Allgemeine Handlung','Warum sind sie hier? Nutze weiche Verben.'),card('Spezifische Handlung','Was sollen sie am Ende konkret tun? Nutze harte Verben.')],{entity});
 const a=group('Zielgruppe '+n,'audience',[
 card('Profil','Stärken, Schwächen und relevante Details.'),card('Emotionale Themen','Haltung zu dir, Thema, Unternehmen / Ort: dafür (+), neutral (Δ), dagegen (−).'),card('Was möchten sie wissen?','Interessen und Fragen dieser Gruppe.'),card('Was müssen sie wissen?','Was brauchen sie, um handeln zu können?'),card('Wissensstand','Was wissen sie bereits?'),card('Schlüsselpunkte für diese Gruppe','Ein Gedanke pro Zeile. Wird automatisch als Hauptpunkte übernommen. Ein Punkt pro Zeile.','',{role:'audience-keys'})],{entity});
 const pos=groups(p,'audience').findIndex(g=>g.kind==='shared-keys');groups(p,'audience').splice(index??(pos<0?groups(p,'audience').length:pos),0,a);const goal=groups(p,'strategy').findIndex(g=>g.kind==='goal');groups(p,'strategy').splice(goal<0?groups(p,'strategy').length:goal,0,s);return a}
function addPoint(p,index,sourceId){const entity=uid(),points=groups(p,'body').filter(g=>g.kind==='point'),n=points.length+1;let shared=groups(p,'audience').find(g=>g.kind==='shared-keys');if(!shared){shared=group('Gemeinsame Schlüsselpunkte','shared-keys',[]);groups(p,'audience').push(shared)}
 let src=sourceId?findCard(p,sourceId)?.card:null;
 if(!src){src=card('Schlüsselpunkt '+n,'Was ist die zentrale Botschaft dieses Punktes?','',{role:'shared-key',entity});const at=index==null?shared.cards.length:Math.min(index,shared.cards.length);shared.cards.splice(at,0,src)}
 const title=card('Hauptpunkt '+n,'Wird vom Schlüsselpunkt übernommen. Wenn du hier schreibst, wird dieser Text eigenständig.','',{source:src.id,role:'point-title'});
 const g=group('Hauptpunkt '+n,'point',[title,...Array.from({length:3},(_,i)=>card('Argument '+(i+1),'Begründung, Beispiel, Quelle oder Geschichte.','',{role:'argument',color:'green'}))],{entity});
 const at=index==null?groups(p,'body').length:Math.min(index,groups(p,'body').length);groups(p,'body').splice(at,0,g);
 const r=group('Schlüsselpunkt '+n,'route-point',[card('Schlüsselpunkt '+n,'Übernimmt den Hauptpunkt, bis du den Text hier separat bearbeitest.','',{source:title.id,role:'route-title'}),card('Ausarbeitung','Wie möchtest du diesen Punkt vermitteln?','',{role:'route-content',color:'green'})],{entity});
 const end=groups(p,'route').findIndex(g=>g.kind==='closing');const routePos=index==null?(end<0?groups(p,'route').length:end):Math.min(1+index,end<0?groups(p,'route').length:end);groups(p,'route').splice(routePos,0,r);return g}
function createProject(title='Meine Roadmap'){const now=new Date().toISOString(),p={id:uid(),schema:3,title,format:'Artikel',created:now,updated:now,phases:{strategy:[],audience:[],body:[],route:[]}};
 p.phases.strategy.push(group('Thema & Wirkung','foundation',[card('Das Thema','Worum geht es – ganz allgemein?'),card('Gewünschte Emotionen','Welche erste und letzte Emotion möchtest du auslösen?'),card('Deine Wahrnehmung','Wie möchtest du wahrgenommen werden?'),card('Deine Fähigkeiten','Welche konkreten Fähigkeiten unterstützen diese Wahrnehmung?')]));
 p.phases.strategy.push(group('Das große Ziel','goal',[card('Gesamtergebnis','Was möchtest du mit deinem Content erreichen?')]));
 p.phases.audience.push(group('Gemeinsame Schlüsselpunkte','shared-keys',[]));
 p.phases.route.push(group('STAR · Eröffnung','opening',[card('Einsatz','Was steht für dein Publikum auf dem Spiel?'),card('Allgemeine Handlungen','Wozu möchtest du zu Beginn einladen?'),card('Vorteile & Konsequenzen','Welches Potenzial haben die allgemeinen Ergebnisse?'),card('Vorschau','Kündige deine Schlüsselpunkte an.')]));
 p.phases.route.push(group('Abschluss & Handlung','closing',[card('Rückblick','Fasse deine Schlüsselpunkte zusammen.'),card('Einsatz','Warum kommt es jetzt darauf an?'),card('Aktion für die Gruppe','Was soll die Gruppe konkret tun?'),card('Aktion für Einzelne','Was soll jede Person konkret tun?'),card('Ergebnisse & Vorteile','Was wird durch diese Handlung möglich?')]));
 for(let i=0;i<3;i++)addAudience(p);for(let i=0;i<3;i++)addPoint(p);return ensureExtras(p)}
function migrate(old){if(old&&(old.schema===2||old.schema===3))return ensureExtras(clone(old));const p=createProject(old.title||'Importierte Roadmap');p.id=typeof old.id==='string'?old.id:p.id;p.format=old.format||'Artikel';p.updated=old.updated||p.updated;const v=old.values||{};function assign(g,keys){keys.forEach((k,i)=>{if(typeof v[k]==='string')g.cards[i].value=v[k]})}

 checklist:['Inhalt (Wissen) steht','Eine Fähigkeit ausgewählt, die ich gezielt übe','Interaktion geplant','Konkrete Verpflichtung notiert'],
 sources:['IMG_6020','IMG_6021'],tags:['Modell','Übung','Verhaltensänderung'],related:['prozess','komfortzone']},
{id:'luecke',cat:'grundlagen',kind:'Methode',title:'Die Kommunikationslücke',
 short:'Der Abstand zwischen deinem aktuellen, sprecherzentrierten Selbst und deinem idealen, hörerzentrierten Selbst.',
 why:'Macht sichtbar, woran du arbeiten solltest, statt dich nur am eigenen Gefühl zu orientieren.',
 body:['Das Schaubild zeigt zwei Dreiecke. Oben das ideale Selbst: hörerzentriert, mit Fähigkeiten, Wissen und Interaktion im Gleichgewicht. Unten das aktuelle reale Selbst: sprecherzentriert.','Dazwischen liegt die Kommunikationslücke. Sie entsteht aus dem Unterschied zwischen Wahrnehmung und Realität, also zwischen dem, wie du dich erlebst, und dem, wie dich der Zuhörer erlebt.'],
 how:['Bitte nach einem Auftritt eine Person um ehrliche Rückmeldung: Was kam an, was nicht?','Nimm dich auf Video auf und vergleiche dein Gefühl mit dem, was du siehst.','Notiere eine Lücke und eine konkrete Maßnahme in deinen Projektnotizen.'],
 checklist:['Rückmeldung eingeholt','Aufnahme angesehen','Größte Lücke benannt','Maßnahme festgelegt'],
 sources:['IMG_6022','IMG_6023'],tags:['Selbstbild','Feedback','Wahrnehmung'],related:['wahrnehmung','prozess']},
{id:'prozess',cat:'grundlagen',kind:'Methode',title:'Der Kommunikationsprozess als Kreislauf',
 short:'Bewertung → Fähigkeitenentwicklung ↔ Wissens- und Inhaltsentwicklung → Verstärkung → Bewertung.',
 why:'Kommunikation wird nicht einmal gelernt, sondern in Runden verbessert. Der Kreislauf zeigt, was nach einem Auftritt kommt.',
 body:['Bewertung: Wo stehe ich? Fähigkeitenentwicklung und Wissens-/Inhaltsentwicklung beeinflussen sich gegenseitig. Verstärkung: Was gut lief, wird gefestigt. Danach folgt die nächste Bewertung.','Zwei Arten von Situationen: ereignisgesteuert (ein Termin steht fest; Fähigkeiten entwickeln, Inhalt hinzufügen) und nachrichtengesteuert (eine Botschaft muss raus; Wissen entwickeln, Fähigkeiten hinzufügen).'],
 how:['Lege fest, ob dein Projekt ereignis- oder nachrichtengesteuert ist.','Plane nach dem Auftritt eine kurze Bewertung ein und halte sie als Notiz fest.'],
 checklist:['Situation bestimmt (ereignis- oder nachrichtengesteuert)','Bewertung nach dem Auftritt notiert','Eine Stärke zum Verstärken benannt'],
 sources:['IMG_6024'],tags:['Prozess','Verbesserung'],related:['luecke','f-w-i']},
{id:'wahrnehmung',cat:'grundlagen',kind:'Wissen',title:'Wahrnehmung vs. Realität: Wirkung vor Gefühl',
 short:'„Entscheide nicht, was sich richtig anfühlt, sondern wähle den Weg, der den größten Effekt hat.“',
 why:'Viele wirksame Techniken fühlen sich anfangs ungewohnt an. Wer nach Gefühl entscheidet, bleibt beim Bequemen.',
 body:['Der zweite Filter. Wahrnehmung und Realität sind beide real. Es gibt nie eine zweite Gelegenheit für einen ersten Eindruck.','Wichtiger ist, wie der Zuhörer mich wahrnimmt. Seine Wahrnehmung unterscheidet sich von der des Sprechers. Ziel ist, beide möglichst zusammenzubringen.','Wenn wir uns von Emotionen leiten lassen, lernen wir nichts Neues. Das Herz soll sich nicht ändern, nur das äußere Auftreten wird angepasst.','Das gleiche Prinzip steht als Leitsatz auf jeder Delivery-Seite: Fokussiere dich auf das, was Wirkung erzeugt, nicht darauf, was sich bequem anfühlt.'],
 how:['Achte bei jeder Darbietungstechnik auf die Zeile „Unterschied in der Wahrnehmung“: Dort steht, wie es sich für dich anfühlt und wie es beim Zuhörer ankommt.','Entscheide nach Wirkung, nicht nach Komfort.'],
 caution:'Randnotiz oben auf der Seite nur teilweise lesbar: sinngemäß kritisieren wir uns für Dinge, die nicht wie geplant liefen, während Zuhörer darauf weniger achten.',
 sources:['IMG_6029','IMG_6032'],tags:['Wahrnehmung','Erster Eindruck','Wirkung'],related:['zwei-filter','darbietung-prinzip','luecke']},
{id:'zwei-filter',cat:'grundlagen',kind:'Wissen',title:'Zwei Filter für jede Situation',
 short:'1. Auf den Zuhörer fokussiert sein. 2. Wahrnehmung vs. Realität.',
 why:'Mit zwei Fragen lässt sich jede Situation prüfen, egal ob Altersgruppe, Kultur oder Thema wechseln.',
 body:['Bei verschiedenen Altersgruppen oder Inhalten gibt es Unterschiede. Damit umzugehen helfen zwei Filter: erstens der Fokus auf den Zuhörer, zweitens der Abgleich zwischen der eigenen Wahrnehmung und der des Zuhörers.'],
 how:['Frage 1: Was braucht dieser Zuhörer, damit er versteht und handelt?','Frage 2: Wie wirkt das, was ich vorhabe, von außen?'],
 sources:['IMG_6028','IMG_6029'],tags:['Prüffragen','Zuhörer','Wahrnehmung'],related:['zuhoererfokus','wahrnehmung','kultur']},
{id:'balance',cat:'grundlagen',kind:'Wissen',title:'Balance aus Inhalt, Darbietung und Interaktion',
 short:'Was wir sagen und wie wir es sagen, muss zusammenpassen.',
 why:'Ein perfekter Text wirkt nicht, wenn er schlecht vorgetragen wird. Die Balance verschiebt den Aufwand von reiner Textarbeit hin zur Wirkung.',
 body:['Effektive Kommunikation hat drei Kreise. Inhalt: klar. Darbietung: prägnant, Augenkontakt, Stimme, Pause, Haltung. Interaktion: Vornamen benutzen, Fragen und Antworten, visuelle Mittel.','In der Mitte liegt die Balance, mit dem Merksatz: „You have to be listener focused!“','Oft verbringt man Stunden damit, den Inhalt perfekt zu machen, und vernachlässigt die Frage, wie man ihn rüberbringt. Ein weiteres Problem: Man belässt es bei der Theorie, statt es umzusetzen.'],
 how:['Teile deine Vorbereitungszeit bewusst auf Inhalt, Darbietung und Interaktion auf.','Prüfe vor dem Auftritt: Passt die Art, wie ich etwas sage, zu dem, was ich sage?'],
 checklist:['Inhalt klar und knapp','Darbietung geübt (Augen, Stimme, Pause, Haltung)','Mindestens zwei Interaktionen geplant'],
 sources:['IMG_6028','IMG_6043'],tags:['Inhalt','Darbietung','Interaktion'],related:['zuhoererfokus','interaktion']},
{id:'komfortzone',cat:'grundlagen',kind:'Übung',title:'Die Komfortzone verlassen',
 short:'Neue Fähigkeiten fühlen sich erst ungewohnt an und werden durch Übung natürlich, wie beim ersten Fahrrad.',
 why:'Ohne den Schritt aus dem Gewohnten entwickeln wir uns als Kommunikatoren nicht weiter.',
 body:['Jeder hat eine Komfortzone; die natürliche Neigung ist, darin zu bleiben, weil wir uns dort sicher fühlen. Alles außerhalb wirkt riskant, wir könnten scheitern. Ohne den Schritt nach draußen wissen wir aber nie, was möglich gewesen wäre.','Das Training ist wie das Fahren des ersten Fahrrads: Je mehr man übt, desto weniger denkt man über das „Wie“ nach. Die Fähigkeiten werden bequem und schließlich natürlich.','Eine eigene Notiz dazu: Mach deine Sicherheit größer als deine Komfortzone.'],
 how:['Wähle pro Woche eine Darbietungstechnik und übe sie in Alltagssituationen.','Notiere, was sich ungewohnt anfühlte und was die Rückmeldung war.'],
 exercise:'Halte eine kurze Rede von 90 Sekunden zu einem beliebigen Thema und wende dabei bewusst eine neue Technik an.',
 caution:'Randnotiz „Nach 90 Sek Übung“ ist nur teilweise lesbar.',
 sources:['IMG_6033','IMG_6043'],tags:['Übung','Mut','Entwicklung'],related:['f-w-i','wahrnehmung']},
// ── Botschaft entwickeln ───────────────────────────────────
{id:'botschaftsprozess',cat:'botschaft',kind:'Methode',title:'Strategischer Prozess zur Entwicklung von Botschaften',
 short:'Sechs Schritte von der Strategie bis zu den Visuals. Die Roadmap der Werkstatt bildet die ersten vier ab.',
 why:'Eine feste Reihenfolge verhindert, dass man mit Folien oder Formulierungen beginnt, bevor Ziel und Zielgruppe klar sind.',
 body:['1. Kommunikationsstrategie-Übersicht. 2. Kommunikationsbewertung: Situationseinschätzung, Kundeneinschätzung, Glaubwürdigkeit des Sprechers. 3. Eröffnung und Abschluss. 4. Hauptteil des Vortrags. 5. Engagement-Tools. 6. Visuals.','In der Werkstatt entsprechen die Roadmap-Phasen Strategie, Zuhörer, Hauptteil und Wegweiser den Schritten 1 bis 4. Engagement-Tools und Visuals ergänzt du über Methoden und eigene Karten.'],
 how:['Arbeite die Roadmap in dieser Reihenfolge durch.','Plane Interaktion (Schritt 5) und Visuals (Schritt 6) erst, wenn Eröffnung, Hauptteil und Abschluss stehen.'],
 checklist:['Strategie-Übersicht ausgefüllt','Situation, Zuhörer und eigene Glaubwürdigkeit eingeschätzt','Eröffnung und Abschluss formuliert','Hauptteil mit Argumenten steht','Engagement-Tools geplant','Visuals festgelegt'],
 sources:['IMG_6045','PDF'],tags:['Prozess','Roadmap','Planung'],related:['strategie','zuhoererbewertung','hauptteil','star']},
{id:'strategie',cat:'botschaft',kind:'Methode',title:'Kommunikationsstrategie-Übersicht',
 short:'Thema, gewünschte Emotionen, Wahrnehmung, Fähigkeiten, Zielgruppen, Handlungen und Gesamtziel auf einer Seite.',
 why:'Die Übersicht ist das Fundament. Alles Weitere wird daran gemessen.',
 body:['Thema: ganz allgemein, worum es geht.','Gewünschte Emotionen: die erste und die letzte Emotion, die erzeugt werden soll.','Wahrnehmung: Wie will ich wahrgenommen werden?','Fähigkeiten: Welche Dinge muss ich konkret tun, um diese Wahrnehmung zu unterstützen? Höchstens drei Darbietungsfähigkeiten.','Zuhörer: Zielgruppen innerhalb eines Publikums, ohne Fähigkeiten oder Wissen zu beschreiben.','Allgemeine Handlungen (Eröffnung): ein Grund, warum sie hier sitzen; mit weichen Verben formuliert.','Spezifische Handlung (Abschluss): Was sollen sie jetzt tun? Mit harten Verben formuliert.','Gesamtergebnis oder Ziel: die große Version.'],
 how:['Fülle die Phase „Strategie“ der Roadmap aus.','Weiche Verben: erkunden, nachdenken, kennenlernen. Harte Verben: anmelden, entscheiden, unterschreiben, kaufen, anrufen.'],
 sources:['PDF'],tags:['Strategie','Ziel','Emotion','Handlung'],related:['emotion-ziel','zuhoererbewertung'],use:'strategy'},
{id:'emotion-ziel',cat:'botschaft',kind:'Methode',title:'Erste und letzte Emotion planen',
 short:'Lege fest, wie sich dein Publikum am Anfang und am Ende fühlen soll.',
 why:'Gefühle bleiben länger als Fakten. Ein bewusst geplanter Bogen gibt dem Inhalt eine Richtung.',
 body:['Die Roadmap fragt nach der ersten und der letzten Emotion. Zwischen beiden liegt der Weg, den dein Hauptteil gehen muss.','Beispiel: am Anfang Neugier, am Ende Zuversicht. Dann muss der Hauptteil Unsicherheit ernst nehmen und Wege zeigen.'],
 how:['Notiere je ein Wort für die erste und die letzte Emotion.','Prüfe den ersten und den letzten Satz: Lösen sie diese Emotionen aus?'],
 sources:['PDF','IMG_6030'],tags:['Emotion','Wirkung'],related:['erinnerung','erster-satz'],use:'strategy'},
{id:'zuhoererbewertung',cat:'botschaft',kind:'Methode',title:'Zuhörerbewertung',
 short:'Profil, Haltung, Wünsche, Bedarf und Wissensstand jeder Zielgruppe, daraus höchstens drei Schlüsselpunkte.',
 why:'Ohne Bild vom Zuhörer kann man nicht hörerzentriert planen. Die Bewertung liefert die Schlüsselpunkte für den Hauptteil.',
 body:['Profil des Zuhörers: Stärken, Schwächen, Details.','Emotionale Themen: Haltung zu mir, zum Thema und zum Unternehmen bzw. Ort. Für (+), neutral (Δ), gegen (−).','Was möchte der Zuhörer wissen? Was muss er wissen?','Wissensstand zum Thema.','Zu behandelnde Schlüsselpunkte: Was, Warum, Wie, Resultate. Wenn möglich nur drei.','In der Werkstatt wird jede Zeile im Feld „Schlüsselpunkte“ automatisch zu einem Hauptpunkt, bis du den Hauptpunkt selbst umformulierst.'],
 how:['Lege pro Zielgruppe eine Gruppe in der Phase „Zuhörer“ an.','Trage Gegenwind ehrlich ein: Wer ist gegen dich, das Thema oder den Ort?'],
 checklist:['Alle Zielgruppen benannt','Haltung zu mir, Thema und Ort eingeschätzt','„Möchte wissen“ und „muss wissen“ getrennt','Wissensstand notiert','Höchstens drei Schlüsselpunkte gewählt'],
 sources:['PDF','IMG_6045'],tags:['Zielgruppe','Analyse','Schlüsselpunkte'],related:['strategie','hauptteil','zwei-filter'],use:'audience'},
{id:'situation',cat:'botschaft',kind:'Checkliste',title:'Situationseinschätzung',
 short:'Logistik, Kleidung, Zeit und Rahmen klären, bevor du den Inhalt festlegst.',
 why:'Die Situation entscheidet mit, was möglich ist: Interaktion, Bewegung, Länge, Technik.',
 body:['Zwei kritische Fragen aus der Mitschrift: Wie ist der logistische Aufbau (Tische, Stühle usw.)? Welche Kleiderordnung gilt?','Dazu kommen Gruppengröße, Dauer und Format (vor Ort oder virtuell).'],
 checklist:['Raum und Aufbau bekannt (Tische, Stühle, Bühne)','Kleiderordnung geklärt','Dauer und Zeitplan inklusive Fragerunde','Gruppengröße','Technik: Mikrofon, Beamer, Kamera','Vor Ort oder virtuell'],
 caution:'Die Seite ist teils unscharf und auf Englisch notiert („logistical set-up“, „dress level“).',
 sources:['IMG_6030','IMG_6045'],tags:['Logistik','Vorbereitung'],related:['zeitplanung','virtuell']},
{id:'glaubwuerdigkeit',cat:'botschaft',kind:'Wissen',title:'Glaubwürdigkeit des Sprechers',
 short:'Vertrauen entsteht, wenn Worte, Stimme, Auftreten und Verhalten übereinstimmen.',
 why:'Die Glaubwürdigkeit ist Teil der Kommunikationsbewertung. Ohne sie kommt auch guter Inhalt nicht an.',
 body:['Wer sich selbst nicht beherrscht, verliert Glaubwürdigkeit (siehe „Kontrolle“).','Wie wir etwas sagen, muss mit dem übereinstimmen, wie wir es tun.','Eigene Notiz: Der beste Weg zu führen ist nicht dein Titel, sondern deine Persönlichkeit.','Zu Vertrauen und Glaubwürdigkeit notiert die Mitschrift außerdem eine Prozentverteilung von Worten, Stimme und Körpersprache (siehe „Stimme“).'],
 how:['Prüfe, ob deine Beispiele zu deinem eigenen Verhalten passen.','Plane, wie du am Anfang zeigst, warum du zu diesem Thema sprichst.'],
 sources:['IMG_6043','IMG_6044','IMG_6038','IMG_6045'],tags:['Vertrauen','Kongruenz'],related:['kontrolle','stimme']},
{id:'hauptteil',cat:'botschaft',kind:'Methode',title:'Hauptteil: Punkte mit Argumenten',
 short:'Drei Hauptpunkte, jeder mit eigenen Argumenten. Drei ist ein Startgerüst, keine Grenze.',
 why:'Eine klare Gliederung macht es dem Zuhörer leicht, zu folgen und sich zu erinnern.',
 body:['Die Vorlage nennt Hauptpunkt 1 bis 3 und Argument 1 bis 3 je Punkt.','In der Werkstatt bildet jeder Hauptpunkt mit seinen Argumenten eine Gruppe. Du kannst weitere Punkte und Argumente an jeder Stelle einfügen und Quellen einzelnen Argumenten zuordnen.'],
 how:['Formuliere jeden Hauptpunkt als ganzen Satz, nicht als Stichwort.','Mische Argumentarten: Begründung, Beispiel, Zahl mit Quelle, Geschichte.','Ordne jedem Argument nach Möglichkeit eine Quelle zu.'],
 checklist:['Jeder Hauptpunkt ist ein Satz','Mindestens zwei Argumente je Punkt','Quellen den Argumenten zugeordnet','Reihenfolge geprüft'],
 sources:['PDF'],tags:['Struktur','Argumente','Quellen'],related:['zuhoererbewertung','star','wiederholung'],use:'body'},
{id:'star',cat:'botschaft',kind:'Methode',title:'Kommunikationswegweiser: STAR-Eröffnung und Abschluss',
 short:'Eröffnung mit Einsatz, Handlungen, Nutzen und Vorschau. Abschluss mit Rückblick, Einsatz und Aufruf zur Aktion.',
 why:'Der Wegweiser verbindet alles zu einem Ablauf, den du direkt vortragen oder in einen Text übersetzen kannst.',
 body:['Eröffnung: STAKE (Einsatz – was steht auf dem Spiel?), allgemeine Handlungen, Potenzial zu allgemeinen Ergebnissen (Vorteile, Konsequenzen), Vorschau der Schlüsselpunkte.','Hauptteil: Schlüsselpunkt 1 bis 3.','Abschluss: Rückblick auf die Schlüsselpunkte, STAKE (Einsatz), allgemeine Handlung, Aufruf zur Aktion für die Gruppe und für den Einzelnen, Ergebnisse und Vorteile.','Die Abkürzung STAR wird in der Vorlage nicht aufgelöst. In der Werkstatt heißt die Gruppe deshalb einfach „STAR · Eröffnung“.'],
 how:['Fülle die Phase „Wegweiser“ aus. Die Schlüsselpunkte werden automatisch aus dem Hauptteil übernommen.','Kündige in der Vorschau genau die Punkte an, die im Rückblick wiederkommen.'],
 checklist:['Einsatz für den Anfang formuliert','Vorschau nennt alle Schlüsselpunkte','Rückblick wiederholt sie','Aufruf zur Aktion mit hartem Verb','Ergebnis und Vorteil am Schluss'],
 sources:['PDF'],tags:['Eröffnung','Abschluss','Ablauf','Handlungsaufforderung'],related:['erster-satz','wiederholung','hauptteil'],use:'route'},
{id:'erster-satz',cat:'botschaft',kind:'Methode',title:'Der erste Satz muss kicken',
 short:'Der Zuhörer entscheidet am Anfang, ob er zuhört. Der erste Satz muss Interesse wecken.',
 why:'Nach dem Einstieg wird es viel schwerer, Aufmerksamkeit zu gewinnen.',
 body:['„Scooby-Doo-Faktor“: Zuhörer denken im Grunde nur eines von zwei Dingen. Entweder „Ich will mehr erfahren“ oder „Wann ist es endlich fertig?“.','Deshalb muss der erste Satz das Interesse wecken, denn der Zuhörer trifft früh die Entscheidung, ob er zuhören will.','Mitschrift: Im persönlichen Gespräch hast du etwa 30 Sekunden, um Aufmerksamkeit zu wecken. Bei Zoom-Meetings deutlich weniger; deshalb pünktlich starten, sonst kommt sofort Ablenkung.'],
 how:['Schreibe fünf mögliche erste Sätze und wähle den stärksten.','Beginne nicht mit Dank, Organisatorischem oder einer Entschuldigung.','Gute Einstiege: eine überraschende Frage, ein konkretes Bild, ein Einsatz („Was steht auf dem Spiel?“).'],
 exercise:'Lies deinen ersten Satz einer Person vor und frag: „Willst du mehr hören?“',
 caution:'30 Sekunden und die kürzere Zeit online sind Werte aus der Mitschrift; die Zahl für Zoom ist schwer lesbar. '+H,
 sources:['IMG_6025','IMG_6026'],tags:['Einstieg','Aufmerksamkeit','Hook'],related:['star','aufmerksamkeit'],use:'route'},
{id:'wiederholung',cat:'botschaft',kind:'Methode',title:'Kernbotschaft wiederholen',
 short:'Was der Zuhörer mitnehmen soll, muss mehrfach vorkommen. Die Notiz spricht von sieben Wiederholungen.',
 why:'Wiederholung verschiebt das Ziel von „mehr sagen“ zu „mehr erinnern“.',
 body:['„7-malige Phrase“: Man muss Dinge siebenmal sagen, damit sich das Gegenüber sie merkt.','Anwendung: Der Kern der Aussage sollte siebenmal wiederholt werden, in unterschiedlicher Form, nicht wortgleich.'],
 how:['Formuliere deine Kernbotschaft als einen Satz.','Plane ihre Stellen: Einstieg, Vorschau, nach jedem Hauptpunkt, Rückblick, Schluss.','Variiere: Frage, Beispiel, Bild, Zitat, Zusammenfassung.'],
 checklist:['Kernbotschaft als ein Satz','Im Einstieg','In der Vorschau','Nach den Hauptpunkten','Im Rückblick','Im Schlusssatz'],
 caution:'Die Zahl Sieben ist eine Faustregel aus dem Kurs. '+H,
 sources:['IMG_6025','IMG_6043'],tags:['Wiederholung','Kernbotschaft','Gedächtnis'],related:['erinnerung','star']},
{id:'kurze-saetze',cat:'botschaft',kind:'Methode',title:'Kurze Sätze, klare Sprache',
 short:'„Ein verwirrter Verstand wird immer ablehnen.“ Kurze bis mittellange Sätze führen zu besserem Verständnis.',
 why:'Wer nicht versteht, sagt nein. Klarheit ist die Voraussetzung für jede Handlung.',
 body:['Keine langen, sondern kurze Sätze. Die Mitschrift nennt als Orientierung das Niveau der 5. bis 8. Klasse, was die Satzlänge angeht.','Das Vokabular darf anspruchsvoll sein; die Satzstruktur muss kurz sein.','Eigene Notiz: „Short to a medium sentence.“'],
 how:['Teile jeden Satz mit mehr als zwei Kommas.','Lies dein Manuskript laut. Wo du Luft holen musst, endet der Satz.','Nutze im Manuskript die Satzlängen-Anzeige der Werkstatt.'],
 caution:'Die Klassenstufe ist eine Faustregel. '+H,
 sources:['IMG_6034','IMG_6044'],tags:['Sprache','Verständlichkeit','Text'],related:['stimme','glaubwuerdigkeit']},
// ── Aufmerksamkeit & Interaktion ───────────────────────────
{id:'aufmerksamkeit',cat:'aufmerksamkeit',kind:'Methode',title:'Aufmerksamkeit halten: Situation wechseln',
 short:'Etwa alle vier bis sechs Minuten sollte sich etwas ändern: Folie, Position, Aktivität.',
 why:'Ohne Wechsel kommen Gedanken, die ablenken. Ein Wechsel holt die Aufmerksamkeit zurück.',
 body:['Mitschrift: Man hat etwa vier bis sechs Minuten, um Interesse zu halten. Gelingt das nicht, kommen Gedanken, die ablenken; andere Dinge wollen erledigt werden.','Prinzip: Alle vier bis sechs Minuten die Situation wechseln, irgendetwas ändern (Folie, Position usw.). Beispiel aus der Predigt: alle paar Minuten an der Kanzel zur Seite treten.','Auch im Sitzen gehen kleine Bewegungen, zum Beispiel sich vorbeugen.','Die Frage ist nicht, ob etwas richtig oder falsch ist, sondern ob es effektiv ist. Bewegung ist ein großes Werkzeug.','Zum Zuhören selbst: Ihr müsst gedanklich präsent sein. Wenn jemand zu dir spricht, leg alles beiseite.'],
 how:['Markiere im Sprechleitfaden alle vier bis sechs Minuten einen Wechsel.','Wechsel-Ideen: Ortswechsel, Frage ans Publikum, Folie, Geschichte, kurze Aufgabe, Stimme oder Tempo.'],
 checklist:['Wechsel alle 4–6 Minuten eingeplant','Mindestens eine Bewegung je Abschnitt','Eine Aufgabe für das Publikum'],
 caution:'4–6 Minuten ist ein Wert aus der Mitschrift. '+H,
 sources:['IMG_6026'],tags:['Aufmerksamkeit','Abwechslung','Bewegung'],related:['interaktion','bewegung','erster-satz']},
{id:'interaktion',cat:'aufmerksamkeit',kind:'Methode',title:'Interaktion gezielt einsetzen',
 short:'Vornamen, Fragen mit Namen, kleine Aufgaben und rhetorische Fragen beziehen das Publikum ein.',
 why:'Beteiligung hält Menschen gedanklich im Raum und macht Inhalte erinnerbar.',
 body:['Interaktion laut Schaubild: Vornamen benutzen, Fragen und Antworten, visuelle Mittel.','Nicht offen fragen „Was denkt ihr darüber?“, sondern Personen mit Namen ansprechen.','Prinzip: „Ich möchte, dass ihr Folgendes aufschreibt, dann erkläre ich es.“','Rhetorische Fragen, bei denen sich andere etwas vorstellen sollen, schaffen auch Raum für eine Bewegung.'],
 how:['Plane mindestens zwei Interaktionen pro Auftritt.','Bereite eine Schreibaufgabe vor, die den nächsten Abschnitt einleitet.'],
 checklist:['Namen der Teilnehmenden bekannt','Gezielte Fragen vorbereitet','Eine Schreibaufgabe','Eine rhetorische Frage'],
 sources:['IMG_6026','IMG_6028','IMG_6038'],tags:['Beteiligung','Fragen','Engagement'],related:['aufmerksamkeit','virtuell','fragen']},
{id:'fragen',cat:'aufmerksamkeit',kind:'Methode',title:'Zeitplanung und Fragen beantworten',
 short:'Plane Zeit für Fragen ein, halte Antworten kurz und kürze nie den Kerninhalt.',
 why:'Wer zu viel Inhalt einplant, überzieht oder streicht am Ende das Wichtigste.',
 body:['„75-%-Regel“ aus der Mitschrift: Bei 60 Minuten plant man Zeit für Fragen ein; notiert ist eine Rechnung mit 15 Minuten Fragen und etwa 30 Minuten Informationen. Leitsatz: „Never compromise your content.“','Eine durchschnittliche Antwort auf eine Frage sollte etwa 60 Sekunden dauern, nicht mehr als 90 Sekunden.','Der letzte Satz, den du sagst, sollte die nächste Frage auslösen.'],
 how:['Lege die Netto-Redezeit fest und plane darin Puffer und Fragerunde.','Übe Antworten auf drei erwartete Fragen mit Stoppuhr.'],
 caution:'Die Rechnung zur 75-%-Regel ist in der Notiz nicht eindeutig; die Werte sind Faustregeln. '+H,

{id:'kontrolle',cat:'aufmerksamkeit',kind:'Wissen',title:'Kontrolle: die 3 C’s',
 short:'Kontrolliere dich selbst, deinen Inhalt und die Umstände.',
 why:'Wer die Kontrolle verliert, verliert Glaubwürdigkeit und Aufmerksamkeit.',
 body:['1. Uns selbst: Wenn man sich selbst nicht beherrscht, verliert man Glaubwürdigkeit.','2. Den Inhalt: Man muss es immer schaffen, auf den Inhalt zurückzukommen. Der letzte Satz sollte die nächste Frage lenken.','3. Die Umstände: zum Beispiel quatschende Kinder. Entscheidungen treffen, statt sie geschehen zu lassen.'],
 how:['Lege dir für Störungen einen Satz zurecht, mit dem du freundlich zum Thema zurückführst.','Notiere vorher, was du bei Technikproblemen tust.'],

{id:'zeitplanung',cat:'aufmerksamkeit',kind:'Checkliste',title:'Zeitplan für einen Auftritt',

// ── Virtuell ───────────────────────────────────────────────
{id:'virtuell',cat:'virtuell',kind:'Checkliste',title:'Virtuelle Meetings: vorher, während, danach',
 short:'Vorher Vorfreude wecken, währenddessen interagieren, danach für Umsetzung sorgen.',
 why:'Online ist Ablenkung nur einen Klick entfernt. Gute Vorbereitung und klare Regeln halten Menschen dabei.',
 body:['Vor dem Meeting: Die Teilnehmenden sollen sich darauf freuen. E-Mail vorher schreiben mit Motivation, Ablauf (Outline) und Logistik (Kamera an). Nicht zwingen, sondern bitten.','Während des Meetings: interagieren und die Aufmerksamkeit halten. Pünktlich starten. Niemand schaltet die Kamera aus; gib Zuhörern nie die Möglichkeit abzuschalten.','Große Gruppen: Ab etwa 15 Teilnehmenden ist echte Interaktion schwierig. Für reine Information ist das kein Problem.','Virtuelle Klassenräume: nicht offen fragen, sondern Personen mit Namen ansprechen.','Länge: Solche Meetings sollten nicht über 90 Minuten gehen. Bewusste Unterbrechungen und Minipausen einplanen. In der Pause eine Aufgabe geben („Überlegt folgende Dinge …“); danach antworten lassen. So ist die Aufmerksamkeit sofort zurück.','Nach dem Meeting: Ziel ist, dass Umsetzung folgt.'],
 checklist:['Einladungs-E-Mail mit Motivation, Ablauf und Logistik','Bitte um eingeschaltete Kamera','Pünktlicher Start','Teilnehmende mit Namen ansprechen','Pause mit Denkaufgabe (bei über 45 Min.)','Höchstens 90 Minuten','Nachfassen: nächste Schritte verschickt'],
 caution:'15 Teilnehmende und 90 Minuten sind Werte aus der Mitschrift. '+H,
 sources:['IMG_6026','IMG_6027'],tags:['Zoom','Online','Meeting'],related:['kamera','interaktion','aufmerksamkeit']},
{id:'kamera',cat:'virtuell',kind:'Checkliste',title:'Kamera und Bildausschnitt',
 short:'Kamera auf Augenhöhe, eine Armlänge Abstand, Gesicht zur Kamera, fester Rahmen wie in der Tagesschau.',
 why:'Online ersetzt die Kamera den Augenkontakt. Eine schlechte Perspektive kostet Präsenz.',
 body:['Die Kamera muss auf Höhe der Augen sein, nicht von unten (notfalls Bücher unterlegen).','Etwa eine Armlänge von der Kamera entfernt sitzen.','Das Gesicht immer zur Kamera richten.','Der Zuschauer soll dich sehen wie in der Tagesschau: ein fester Rahmen, in dem man sich bewegen kann.','Randnotiz „Mental real estate – everything counts“: Leute sehen, was du machst; das hinterlässt einen Eindruck, der lange aufgebaut werden muss.'],

 sources:['IMG_6027'],tags:['Zoom','Kamera','Online'],related:['virtuell','augenkontakt']},

{id:'darbietung-prinzip',cat:'darbietung',kind:'Wissen',title:'Darbietung: Wirkung statt Bequemlichkeit',
 short:'Jede Technik wird gleich beschrieben: bequem, Ergebnisse, Wirkung, Vorteile, Wahrnehmung, Übung.',
 why:'Das Schema zeigt bei jeder Technik, warum das Ungewohnte besser wirkt.',
 body:['Die Delivery-Seiten (Darbietung, im Ordner „Lieferung“ übersetzt) folgen alle demselben Aufbau: Was ist bequem? Welche Ergebnisse hat das? Was erzeugt Wirkung? Welche Vorteile bringt das? Wie unterscheidet sich die Wahrnehmung von Zuhörer und Kommunikator? Wie übt man?','Leitsatz: Fokussiere dich auf das, was Wirkung erzeugt, nicht darauf, was sich bequem anfühlt.','Mitschrift: Leute erkennen nicht, was ihr macht; sie erkennen nur die Auswirkung.'],
 how:['Wähle pro Projekt höchstens drei Darbietungsfähigkeiten (so verlangt es auch die Strategie-Übersicht).','Füge sie als Methoden zum Projekt hinzu und hake die Übungen ab.'],
