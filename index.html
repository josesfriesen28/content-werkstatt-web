{id:'haltung',cat:'darbietung',kind:'Übung',title:'Haltung im Stehen',
 short:'Ausbalanciert auf beiden Füßen, etwa hüftbreit, Arme entspannt, Körper zum Publikum offen.',
 why:'Der Zuhörer liest die Körperhaltung, bevor er zuhört.',
 body:['Bequem: unausgeglichen auf einem Bein, Beine überkreuzt.','Ergebnisse: wirkt zu lässig und zu entspannt; der Zuhörer liest die Haltung vor dem Zuhören.','Wirkung: ausbalanciert auf beiden Füßen etwa in Hüftbreite stehen, Arme entspannt an den Seiten (außer beim Gestikulieren), Körper für die Mehrheit des Publikums offen halten.','Vorteile: wirkt neutral, offen, zuversichtlich und entspannt.','Wahrnehmung: Für Zuhörer offen, stark, ausbalanciert, zuversichtlich. Für dich selbst anfangs steif, starr, soldatisch.'],
 exercise:'Steh in der Schlange am Geldautomaten, im Supermarkt oder im Kino bewusst ausbalanciert auf beiden Füßen.',
 checklist:['Beide Füße, hüftbreit','Arme entspannt an den Seiten','Körper zur Mehrheit des Publikums'],
 sources:['IMG_6032'],tags:['Haltung','Körpersprache','Stehen'],related:['haltung-sitzen','darbietung-prinzip']},
{id:'haltung-sitzen',cat:'darbietung',kind:'Übung',title:'Haltung im Sitzen und die Hände',
 short:'Gerade sitzen, Hände sichtbar und auseinander, bei Bitten leicht über den Tisch lehnen.',
 why:'In Besprechungen und online wird meist gesessen. Die Grundsätze des Stehens gelten auch hier.',
 body:['Einfach gerade sitzen. Kulturelle Aspekte beachten, zum Beispiel die Schuhsohle nicht in Richtung einer Person zeigen.','Hände immer auseinander, so wie beim Stehen. Auch am Tisch auseinander und auf dem Tisch, nicht darunter.','Bei Bitten leicht über den Tisch lehnen.'],
 exercise:'Achte im nächsten Meeting darauf, wo deine Hände liegen. Lege sie sichtbar und getrennt auf den Tisch.',
 caution:'Zur Beinhaltung im Sitzen ist die Notiz nicht eindeutig lesbar.',
 sources:['IMG_6034'],tags:['Haltung','Sitzen','Hände','Meeting'],related:['haltung','kultur','gesten']},
{id:'augenkontakt',cat:'darbietung',kind:'Übung',title:'Augenkontakt',
 short:'Sprich nur, wenn du jemandem in die Augen schaust: ein Gedanke pro Person, etwa drei bis fünf Sekunden.',
 why:'Augenkontakt macht aus einer Rede eine Serie von Einzelgesprächen. Das schafft Vertrauen und Klarheit.',
 body:['Bequem: den Raum scannen, über die Köpfe hinwegsehen, zu Boden, Decke oder Bildschirm sprechen.','Ergebnisse: wirkt nervös, Füllwörter, mangelnde Konzentration, Bewegung wirkt wie Rennen.','Wirkung: nur mit einem Paar Augen sprechen; ein Gedanke, ein Konzept, ein Satz pro Person; drei bis fünf Sekunden pro Person; einen zufälligen Ansatz verwenden.','Vorteile: schafft Vertrauen, Klarheit der Gedanken, engagierte Personen, weniger Füllwörter, und du kannst dein Publikum besser lesen.','Wahrnehmung: Für Zuhörer wie ein Einzelgespräch, persönlich und involviert. Für dich selbst wie Starren, unnatürlich, unangenehm.','Mitschrift: Kontakt aufbauen (direkt in die Augen, nicht vorbei), auf Augenhöhe sprechen. Wenn dich keiner anschaut, passt niemand auf. „3 C’s of eye contact“: Connect, Conversation, Confident. Notierte Rechnung: 5 Sekunden pro Person ergibt in zehn Minuten 120 Personen.','Kulturell: Im Westen gelten 3–5 Sekunden als angemessen, in Japan eher 1–3 Sekunden.'],
 exercise:'Die einfachste und zugleich schwierigste Übung: Sprich im Alltag nur, wenn du jemandem in die Augen schaust (Kinder, Partner, Freunde). Dreh dich vom Fernseher weg. Beende jeden Gedanken bei einer Person.',
 checklist:['Ein Gedanke pro Person','3–5 Sekunden','Erst Augen finden, dann sprechen','Nicht über Köpfe oder auf Folien sprechen'],
 caution:'Die Sekundenangaben und Kulturwerte stammen aus Unterlagen und Mitschrift. '+H,
 sources:['IMG_6035','IMG_6036','IMG_6028'],tags:['Augenkontakt','Vertrauen','Körpersprache'],related:['lieferplan','kultur','bewegung']},
{id:'bewegung',cat:'darbietung',kind:'Übung',title:'Bewegung: Blicken – Bewegen – Pflanzen',
 short:'Erst Augen finden, dann zielgerichtet gehen, dann wieder fest und ausbalanciert stehen.',
 why:'Gezielte Bewegung schafft Energie, holt Aufmerksamkeit zurück und baut Nervosität ab.',
 body:['Bequem: an einem Ort feststecken (hinter dem Podium, in der Bühnenmitte), hin und her gehen, mit dem Körper führen.','Ergebnisse: langweilig, energielos, ängstlich, nicht selbstbewusst.','Wirkung, drei Schlüssel: BLICKEN – zuerst auf ein Paar Augen schließen. BEWEGEN – Füße zweitens, Schultern drittens, mit klarem Ziel. PFLANZEN – zu einer festen, ausbalancierten Position zurückkehren.','Vorteile: schafft Energie, erhöht die Beteiligung, setzt Nervenenergie frei.','Wahrnehmung: Für Zuhörer fließend, entspannt, natürlich. Für dich selbst, als würde man Menschen ausschließen; erzwungen; Sorge, dem Publikum den Rücken zuzudrehen.','Mitschrift: Der wichtigste Grund, sich zu bewegen, ist, Interesse zu halten oder zurückzugewinnen.'],
 exercise:'„Lock n’ Load“: Klebe Gesichter (Post-its oder Papier) an Stuhllehnen im Raum. Übe, dich auf einen Stuhl zuzubewegen: Blicken – Bewegen – Pflanzen.',
 checklist:['Erst Blick, dann Bewegung','Klares Ziel für jeden Gang','Danach fest stehen','Nicht hin und her pendeln'],
 sources:['IMG_6037'],tags:['Bewegung','Bühne','Energie'],related:['raum','aufmerksamkeit','lieferplan']},
{id:'raum',cat:'darbietung',kind:'Methode',title:'Bewegung im Raum: vier Prinzipien',
 short:'Nur reden, wenn du in Augen schaust; Augen führen dich nach vorn; suche Anker; steh im Winkel.',
 why:'Gibt konkrete Regeln für Gänge auf der Bühne, auch für den Weg zurück.',
 body:['Niemals rückwärts gehen. Wie kommt man von vorn wieder zurück?','1. Wenn deine Augen nicht in die eines anderen schauen, wird nicht geredet. Also entweder schweigend zurückgehen oder eine rhetorische Frage stellen (die anderen sollen sich etwas vorstellen) und währenddessen zurückgehen.','2. Augen bringen dich nach vorn: Schau einer Person in die Augen; nur bis zu ihr gehst du.','3. Suche dir einen Anker: dich von Person zu Person vorarbeiten.','4. Steh im Winkel zu deiner Zuhörerschaft: Andere sollen deinen Rücken nicht sehen.','Notizen sind in Ordnung, wenn man sie sicher und bewusst benutzt.'],
 checklist:['Nie rückwärts gehen','Rückweg mit rhetorischer Frage oder schweigend','Anker im Publikum gewählt','Im Winkel stehen'],
 sources:['IMG_6038','IMG_6028'],tags:['Bewegung','Bühne','Raum'],related:['bewegung','kontrolle']},
{id:'gesten',cat:'darbietung',kind:'Übung',title:'Gesten',
 short:'Oberhalb der Taille, offen und voll, das Bild malen. Danach Arme entspannen.',
 why:'Gesten betonen Aussagen und helfen dem Publikum, sich Bilder zu machen.',
 body:['Bequem: kleine, sich wiederholende Gesten; Gesten unterhalb der Taille; aus dem Ellbogen statt aus dem ganzen Arm; keine oder nur einarmige Gesten.','Ergebnisse: Das Publikum schaut auf die Hände statt aufs Gesicht; die Geste passt nicht zur Nachricht; wirkt zurückhaltend und unsicher.','Wirkung: oberhalb der Taille, offen und voll, expressiv und weitreichend – das Bild malen. Nach der Geste die Arme wieder an den Seiten entspannen. Je nach Gespräch variieren.','Vorteile: selbstbewusst, ausdrucksstark, aufrichtig; das Publikum entwickelt eigene Bilder; bringt Energie.','Wahrnehmung: Für Zuhörer natürlich, offen, im Einklang mit dem Gespräch. Für dich selbst groß, „Drama Club“, übertrieben.','Mitschrift, warum Gesten: 1. Hervorheben (Aussage betonen). 2. Visualisieren (Aktivitäten und Verben zeigen).','Nicht tun: mit dem Finger auf Leute zeigen; lieber die offene Handfläche, nicht den Handrücken. Die Handfläche führt: Sie zeigt in die Richtung, in die sich etwas bewegen soll. Ellbogen nicht anlegen, etwas Luft zwischen Arm und Körper. Wiederholte Gesten ergeben keinen Sinn. Den Körper nicht überkreuzen, also mit links nicht nach rechts zeigen.'],
 exercise:'Beobachte die Gesten anderer. Achte darauf, was deine Hände tun, wenn du über ein Lieblingsthema sprichst. Übe, als müsstest du beschreiben, worüber du sprichst. Vermeide ablenkende Gesten: „Velcro-Ellenbogen“, „toter Hund“, „Sicherheitszone“.',
 checklist:['Oberhalb der Taille','Offene Handfläche statt Zeigefinger','Arme zwischendurch entspannen','Keine Wiederholungsgesten','Körper nicht überkreuzen'],
 sources:['IMG_6039','IMG_6040'],tags:['Gesten','Hände','Körpersprache'],related:['haltung','gesicht']},
{id:'gesicht',cat:'darbietung',kind:'Übung',title:'Gesichtsausdruck',
 short:'Nutze viele Gesichtsanimationen und lächle, wo es passt. Sei dir bewusst, was dein Gesicht sagt.',
 why:'Ein ausdrucksloses Gesicht wirkt verschlossen. Ein passender Ausdruck macht dich zugänglich.',
 body:['Bequem: kein Bewusstsein für Ausdruck oder Animation; ein Bart kann Ausdruck verdecken; es fühlt sich an wie ein Lächeln, ist für Zuhörer aber nicht sichtbar; standardmäßig ernstes Geschäftsgesicht.','Ergebnisse: wirkt verschlossen und unnahbar.','Wirkung: eine Vielzahl von Gesichtsanimationen verwenden, um Informationen zu vermitteln; bei Bedarf ein Lächeln hinzufügen.','Vorteile: aufrichtig, offen, warm und freundlich; wirkt entspannt und selbstbewusst.','Wahrnehmung: Für Zuhörer freundlich, offen, zugänglich. Für dich selbst erzwungen, falsch, unaufrichtig.','Mitschrift: Sei dir einfach bewusst, was dein Gesicht sagt. Lachen bei schlechten Nachrichten wäre unpassend.'],
 exercise:'Stell beim Telefonieren einen Spiegel vor dich. So merkst du, wie andere dein Gesicht sehen.',
 checklist:['Ausdruck passt zur Aussage','Lächeln dort, wo es passt','Online: Gesicht gut ausgeleuchtet'],
 sources:['IMG_6041'],tags:['Mimik','Gesicht','Körpersprache'],related:['gesten','stimme']},
{id:'stimme',cat:'darbietung',kind:'Wissen',title:'Stimme, Pause und Übereinstimmung',
 short:'Kurze Sätze, bewusste Pausen, und Stimme und Körper müssen zur Botschaft passen.',
 why:'Gerade wenn Worte und Auftreten nicht übereinstimmen, verlassen sich Zuhörer auf Stimme und Körpersprache.',
 body:['Stimme gehört zur Darbietung, zusammen mit Pause und Haltung.','Mitschrift „Vertrauen & Glaubwürdigkeit“: im persönlichen Gespräch Worte 7 %, Stimme 38 %, Visuelles 55 %; am Telefon Worte 15 %, Stimme 85 %. Visuelles und Stimme seien viel wichtiger. Dazu eine Notiz, dass diese Verteilung gilt, wenn die Nachricht nicht übereinstimmt.','Pause ist ein eigener Schritt im Lieferplan: Nach dem Gesagten wirken lassen.'],
 how:['Plane Pausen nach Kernaussagen ausdrücklich ein (im Sprechleitfaden mit ‖ markieren).','Prüfe, ob Tonfall und Körpersprache zur Aussage passen.'],
 caution:'Die 7-38-55-Verteilung geht auf Experimente von Albert Mehrabian zurück, die nur widersprüchliche Gefühlsbotschaften untersucht haben. Sie gilt nicht allgemein für Kommunikation. Die Telefonwerte sind ungeprüft. Der in der Notiz genannte Name ist schwer lesbar.',
 sources:['IMG_6043','IMG_6028','IMG_6034'],tags:['Stimme','Pause','Glaubwürdigkeit'],related:['kurze-saetze','lieferplan','glaubwuerdigkeit']},
{id:'lieferplan',cat:'darbietung',kind:'Methode',title:'Kommunikationslieferplan',
 short:'Augen → Bewegen (Blicken, Bewegen, Pflanzen) → Sprechen → Pause. Dann von vorn.',
 why:'Der Kreislauf verbindet Augenkontakt, Bewegung, Sprechen und Pause zu einem Ablauf, den man trainieren kann.',
 body:['Englische Fassung: Eyes → Move (Look, Move, Plant) → Speak → Pause.','Kurzform aus der Mitschrift („Steps“): 1. Augen finden, 2. reden, 3. bewegen.','In der Werkstatt steht der Lieferplan als Erinnerung im Sprechleitfaden.'],
 how:['Übe einen Abschnitt deines Vortrags nur nach diesem Kreislauf.','Zähle innerlich: finden – sprechen – Pause – weiter.'],

{id:'kultur',cat:'darbietung',kind:'Wissen',title:'Kulturelle Unterschiede',
 short:'Augenkontakt, Gesten und Sitzhaltung werden kulturell unterschiedlich gelesen.',

{id:'authentisch',cat:'darbietung',kind:'Reflexion',title:'Authentisch bleiben: Style, Skills, Spirit',

 body:['„More from Christ, less than me!“ (Randnotiz auf Foundation 7).','Zuhörerfokus: auch Jesus war so (Beispiele: das Kind, die Frau am Brunnen).','Jeder hat seinen eigenen Stil – Psalm 139. Fundament auf dem Heiligen Geist.','„Nicht das Herz ändern, nur das äußere Auftreten anpassen.“','„Mache deine Zukunft größer als deine Gegenwart“ – lebenslang.','„Mach deine Sicherheit (dein Selbstbewusstsein) größer als deine Komfortzone!“ – Jeder sollte das hören.','Versuche dem, was kommt, eine offene Haltung zu geben.','„The best way to lead is not your title, it is your personhood!“','„You are present in the morning!“ (Bedeutung im Zusammenhang unklar.)'],

function dueInfo(p){if(!p.deadline)return null;const d=Math.round((new Date(p.deadline+'T12:00')-new Date())/864e5);return{d,text:d<0?'überfällig':d===0?'heute':d===1?'morgen':d<=14?'in '+d+' Tagen':fmtDate(p.deadline),cls:d<0?'late':d<=7?'soon':''}}
function relDate(iso){if(!iso)return'';const d=Math.floor((Date.now()-new Date(iso))/864e5);return d<=0?'heute':d===1?'gestern':d<7?'vor '+d+' Tagen':fmtDate(iso)}
const SORTS={title:p=>(p.title||'').toLowerCase(),format:p=>p.format,status:p=>M.STATUS.indexOf(p.status),progress:p=>M.progress(p).pct,deadline:p=>p.deadline||'9999',updated:p=>p.updated||''};
function vStart(){const all=[...data.projects];const q=(ui.startQ||'').trim().toLowerCase();const match=p=>!q||(p.title+' '+p.summary+' '+p.tags.join(' ')+' '+p.format).toLowerCase().includes(q);
 const recent=[...all].sort((a,b)=>(b.updated||'').localeCompare(a.updated||'')).slice(0,3);const upcoming=all.filter(p=>p.deadline&&p.status!=='Fertig').sort((a,b)=>a.deadline.localeCompare(b.deadline)).slice(0,4);
 const active=all.filter(p=>p.status!=='Fertig').length;const sf=ui.startFolder;if(sf&&sf!=='__none'&&!data.folders.some(f=>f.id===sf))ui.startFolder='';
 const inF=p=>!ui.startFolder||(ui.startFolder==='__none'?!folderOf(p):p.folder===ui.startFolder);
 const {k,dir}=ui.sort;const sorted=all.filter(p=>match(p)&&inF(p)).sort((a,b)=>{const x=SORTS[k](a),y=SORTS[k](b);return(x>y?1:x<y?-1:0)*dir});

 const th=(key,label)=>`<th><button type="button" data-act="sort" data-k="${key}" class="${k===key?'on':''}">${label}${k===key?(dir>0?' ↑':' ↓'):''}</button></th>`;
 const row=p=>{const pr=M.progress(p),du=dueInfo(p);return`<tr draggable="true" data-pcard="${p.id}" class="${p.id===project.id?'current':''}"><td><button class="row-title" type="button" data-act="open-project" data-id="${p.id}">${esc(p.title||'Ohne Titel')}</button>${p.summary?`<div class="row-sub">${esc(p.summary.slice(0,90))}</div>`:''}</td><td>${esc(p.format)}</td><td><span class="status-pill" data-tone="${STATUS_TONE[p.status]||'idea'}">${esc(p.status)}</span></td><td><span class="bar mini"><i style="width:${pr.pct}%"></i></span><span class="mono">${pr.pct}%</span></td><td class="${du?du.cls:''}">${du?esc(du.text):'<span class="muted">–</span>'}</td><td class="muted">${esc(relDate(p.updated))}</td><td><button class="icon-btn" type="button" data-act="project-menu" data-id="${p.id}" aria-label="Projekt-Aktionen">${icon('dots')}</button></td></tr>`};
 let list;
 if(ui.startMode==='cards'){list=ui.startFolder?`<div class="pgrid">${sorted.map(p=>projectCard(p)).join('')}<button class="pnew" type="button" data-act="new-project-in" data-id="${ui.startFolder==='__none'?'':ui.startFolder}">${icon('plus')}Neues Projekt</button></div>`:[...data.folders,null].map(f=>{const ps=sorted.filter(p=>f?p.folder===f.id:!folderOf(p));if(!ps.length&&!f)return'';return`<section class="folder" data-folder-drop="${f?f.id:''}"><header class="folder-head">${icon(f?'folder':'grid','ico fh-ico')}<h2>${esc(f?f.name:(data.folders.length?'Ohne Ordner':'Alle Projekte'))}</h2><span class="mono muted">${ps.length}</span>${f?`<button class="icon-btn" type="button" data-act="folder-menu" data-id="${f.id}" aria-label="Ordner bearbeiten">${icon('dots')}</button>`:''}</header><div class="pgrid">${ps.map(p=>projectCard(p)).join('')}<button class="pnew" type="button" data-act="new-project-in" data-id="${f?f.id:''}">${icon('plus')}Neues Projekt</button></div></section>`}).join('')}
 else{const head=`<thead><tr>${th('title','Projekt')}${th('format','Format')}${th('status','Status')}${th('progress','Fortschritt')}${th('deadline','Termin')}${th('updated','Zuletzt')}<th></th></tr></thead>`;
  let rows;if(ui.startFolder)rows=sorted.map(row).join('');else rows=[...data.folders,null].map(f=>{const ps=sorted.filter(p=>f?p.folder===f.id:!folderOf(p));if(!f&&!ps.length)return'';if(!f&&!data.folders.length)return ps.map(row).join('');const closed=f&&ui.folderOpen[f.id]===false;return`<tr class="folder-row" data-folder-drop="${f?f.id:''}"><td colspan="7"><div class="fr"><button class="icon-btn" type="button" data-act="toggle-folder" data-id="${f?f.id:''}" ${f?'':'disabled'} aria-expanded="${!closed}" style="${closed?'transform:rotate(-90deg)':''}">${icon('fold')}</button>${icon(f?'folder':'grid','ico fh-ico')}<b>${esc(f?f.name:'Ohne Ordner')}</b><span class="mono muted">${ps.length}</span><span class="fr-sp"></span><button class="btn sm ghost" type="button" data-act="new-project-in" data-id="${f?f.id:''}">${icon('plus')}Projekt</button>${f?`<button class="icon-btn" type="button" data-act="folder-menu" data-id="${f.id}" aria-label="Ordner bearbeiten">${icon('dots')}</button>`:''}</div></td></tr>${closed?'':ps.map(row).join('')||`<tr><td colspan="7" class="muted empty-row">Noch leer. Zieh ein Projekt hierher.</td></tr>`}`}).join('');
  list=`<div class="table-wrap plist"><table class="ptable">${head}<tbody>${rows||`<tr><td colspan="7" class="muted empty-row">${q?'Kein Projekt passt zur Suche.':'Noch keine Projekte.'}</td></tr>`}</tbody></table></div>`}
 return`<section class="vhead compact"><div><div class="eyebrow">${all.length} Projekt${all.length===1?'':'e'} · ${active} in Arbeit</div><h1>Deine <em>Werkstatt</em></h1></div><div class="actions"><button class="btn primary" type="button" data-act="new-project-in" data-id="${ui.startFolder&&ui.startFolder!=='__none'?ui.startFolder:''}">${icon('plus')}Neues Projekt</button></div></section>
 ${q?'':`<div class="start-top"><section><div class="eyebrow" style="margin-bottom:10px">Weiterarbeiten</div><div class="recent">${recent.map(p=>projectCard(p,true)).join('')}</div></section>
 <section class="panel"><div class="panel-head"><h3>Nächste Termine</h3></div>${upcoming.length?`<ul class="mini-list">${upcoming.map(p=>{const du=dueInfo(p);return`<li><span><button class="link-btn" type="button" data-act="open-project" data-id="${p.id}">${esc(p.title)}</button><br><span class="muted ${du.cls}">${esc(du.text)} · ${esc(p.status)}</span></span></li>`}).join('')}</ul>`:'<div class="empty">Trag in einem Projekt unter „Rahmen“ einen Termin ein, dann erscheint er hier.</div>'}</section></div>`}
 <div class="start-bar">${chips}<label class="search sm">${icon('research')}<input type="search" id="startSearch" data-act-input="start-search" value="${esc(ui.startQ||'')}" placeholder="Projekte suchen" aria-label="Projekte suchen"></label><div class="seg" role="group" aria-label="Darstellung"><button type="button" data-act="start-mode" data-v="list" aria-pressed="${ui.startMode!=='cards'}">Liste</button><button type="button" data-act="start-mode" data-v="cards" aria-pressed="${ui.startMode==='cards'}">Karten</button></div></div>${list}`}
function touchFolders(){data.foldersUpdated=new Date().toISOString();dirty.add('__folders')}

function folderPicker(p){openDialog(`<div class="dlg-head"><h2>In Ordner verschieben</h2><button class="icon-btn" type="button" data-close aria-label="Schließen">${icon('x')}</button></div><p class="muted" style="margin:0">„${esc(p.title)}“</p><div style="display:grid;gap:8px">${data.folders.map(f=>`<button class="variant" type="button" data-act="move-to" data-id="${p.id}" data-folder="${f.id}" aria-pressed="${p.folder===f.id}"><b>${esc(f.name)}</b><span>${data.projects.filter(x=>x.folder===f.id).length} Projekte</span></button>`).join('')}<button class="variant" type="button" data-act="move-to" data-id="${p.id}" data-folder="" aria-pressed="${!folderOf(p)}"><b>Ohne Ordner</b></button></div><div class="dlg-actions"><button class="btn" type="button" data-act="new-folder-for" data-id="${p.id}">${icon('plus')}Neuer Ordner</button></div>`)}

 const head=`<header class="pres-bar"><div class="pres-title"><span class="eyebrow">${esc(project.format)}</span><b>${esc(project.title||'Ohne Titel')}</b></div><div class="chips">${M.phases.map(ph=>`<button class="chip" type="button" data-act="pres-phase" data-v="${ph.id}" aria-pressed="${sel.has(ph.id)}">${esc(ph.name)}</button>`).join('')}</div><div class="pres-tools"><div class="seg" role="group" aria-label="Darstellung"><button type="button" data-act="pres-mode" data-v="board" aria-pressed="${pres.mode==='board'}">Gesamtboard</button><button type="button" data-act="pres-mode" data-v="step" aria-pressed="${pres.mode==='step'}">Gruppe für Gruppe</button></div><label class="checkline"><input type="checkbox" id="presEmpty" data-act="pres-empty" ${pres.empty?'checked':''}>Leere zeigen</label><button class="icon-btn" type="button" data-theme-btn></button><button class="icon-btn" type="button" data-act="pres-full" aria-label="Vollbild" title="Vollbild">${icon('expand')}</button><button class="btn" type="button" data-act="pres-close">${icon('x')}Schließen</button></div></header>`;

 else{const x=list[pres.idx];body=`<div class="pres-step"><div class="pres-step-head"><span class="eyebrow">${esc(x.ph.name)} · ${esc(tplLabel(x.g)||kindLabel[x.g.kind]||'Gruppe')}</span><h2>${esc(groupName(x.g))}</h2></div><div class="pres-cards">${x.cards.map(presCard).join('')}</div></div>`;foot=`<footer class="pres-nav"><button class="btn" type="button" data-act="pres-step" data-d="-1" ${pres.idx===0?'disabled':''}>${icon('left')}Zurück</button><div class="pres-dots" aria-label="Position">${list.map((_,i)=>`<button type="button" data-act="pres-go-step" data-i="${i}" aria-label="Gruppe ${i+1}" ${i===pres.idx?'aria-current="step"':''}></button>`).join('')}</div><span class="mono">${pres.idx+1} / ${list.length}</span><button class="btn" type="button" data-act="pres-step" data-d="1" ${pres.idx>=list.length-1?'disabled':''}>Weiter${icon('right')}</button></footer><div class="pres-hint">Augen → Bewegen → Sprechen → Pause · Pfeiltasten blättern · B für Gesamtboard · Esc schließt</div>`}
 el.innerHTML=head+`<div class="pres-body">${body}</div>`+foot;applyTheme()}

 case'status-menu':openMenu(b,M.STATUS.map(s=>({label:esc(s),current:s===project.status,run:()=>mutate(()=>{project.status=s})})));break;
 case'data-menu':openMenu(b,[{heading:'Content Werkstatt '+APP_VERSION},{label:'Sicherung speichern',run:backupAll},{label:'Sicherung importieren',run:()=>$('#importFile').click()},{label:'Papierkorb'+(data.trash.length?` (${data.trash.length})`:''),run:showTrash},'-',{heading:$('#saveState').title||''}]);break;
 case'project-menu':projectMenu(b,id);break;case'folder-menu':folderMenu(b,id);break;

 case'new-folder':newFolder();break;

 case'new-project-in':promptBox('Neues Projekt','Arbeitstitel','').then(t=>{if(!t)return;mutate(()=>{const p=M.createProject(t);p.folder=id||'';data.projects.push(p);project=p;data.selected=p.id;ui.view='uebersicht'},'Projekt angelegt');window.history.replaceState(null,'','#uebersicht')});break;
 case'present':openPresent();break;
 case'pres-close':closePresent();break;

 case'pres-phase':{const s=pres.phases||new Set(M.phases.map(x=>x.id));if(s.has(b.dataset.v)&&s.size>1)s.delete(b.dataset.v);else s.add(b.dataset.v);pres.phases=s;pres.idx=0;renderPresent();break}
 case'pres-empty':pres.empty=b.checked;renderPresent();break;case'pres-empty-on':pres.empty=true;renderPresent();break;
 case'pres-go':pres.idx=+b.dataset.i;pres.mode='step';renderPresent();break;case'pres-go-step':pres.idx=+b.dataset.i;renderPresent();break;
 case'pres-step':pres.idx+=+b.dataset.d;renderPresent();break;
 case'pres-full':{const el=$('#present');if(document.fullscreenElement)document.exitFullscreen().catch(()=>{});else if(el.requestFullscreen)el.requestFullscreen().catch(()=>toast('Vollbild ist hier nicht verfügbar.'));break}
 }});

 if(k==='Escape'){e.preventDefault();closePresent();return}

 if(['ArrowRight','ArrowDown','PageDown',' '].includes(k)){e.preventDefault();if(pres.idx<n-1){pres.idx++;renderPresent()}}

const PHASE_LIB={strategy:['strategie','emotion-ziel'],audience:['zuhoererbewertung'],body:['hauptteil'],route:['star','erster-satz']};
function vRoadmap(){const ph=M.phases.find(x=>x.id===ui.phase)||M.phases[0];const groups=project.phases[ph.id];
 const steps=M.phases.map((x,i)=>{const cs=project.phases[x.id].flatMap(g=>g.cards);const f=cs.filter(c=>M.value(project,c).trim()).length;return`<button class="step-btn" type="button" role="tab" aria-selected="${x.id===ph.id}" data-act="phase" data-phase="${x.id}"><span class="step-h"><b>${i+1} ${esc(x.name)}</b><span class="mono">${f}/${cs.length}</span></span><span class="bar"><i style="width:${cs.length?f/cs.length*100:0}%"></i></span></button>`}).join('');
 const libs=(PHASE_LIB[ph.id]||[]).map(id=>LIB.byId(id)).filter(Boolean).map(e=>`<button class="lib-link" type="button" data-act="open-entry" data-id="${e.id}">${icon('book')}${esc(e.title)}</button>`).join('');
 const empties=groups.reduce((n,g)=>n+g.cards.filter(c=>!M.value(project,c).trim()).length,0);
 let body;
 if(ui.mode==='step'){ui.step=Math.min(ui.step,Math.max(0,groups.length-1));const g=groups[ui.step];body=`<div class="step-wrap"><div class="step-nav"><button class="btn" type="button" data-act="step" data-d="-1" ${ui.step===0?'disabled':''}>${icon('left')}Zurück</button><span class="mono">Gruppe ${groups.length?ui.step+1:0} von ${groups.length}</span><button class="btn" type="button" data-act="step" data-d="1" ${ui.step>=groups.length-1?'disabled':''}>Weiter${icon('right')}</button></div>${g?groupHtml(g,ph,true):'<div class="empty">Diese Phase hat noch keine Gruppen.</div>'}</div>`}
 else{body=`<div class="board">${groups.map(g=>groupHtml(g,ph)).join('')}${addTile(ph.id,groups.length)}</div>`}
 return`<h1 class="sr">Roadmap · ${esc(ph.name)}</h1><div class="stepper" role="tablist" aria-label="Phasen">${steps}</div>
 <div class="rm-tools"><p class="rm-desc"><b>${esc(ph.title.replace(/\.$/,''))}.</b> ${esc(ph.desc)}</p>${libs}<span class="rm-sp"></span>
 <label class="search sm">${icon('research')}<input type="search" id="rmSearch" data-act-input="rm-search" value="${esc(ui.q)}" placeholder="Suchen" aria-label="Post-its durchsuchen"></label>
 ${ui.mode==='board'?`<button class="chip" type="button" data-act="toggle-empty" aria-pressed="${ui.showEmpty}" title="Leere Felder ein- oder ausblenden">${ui.showEmpty?'Leere Felder sichtbar':'Leere Felder ausgeblendet'}${empties?` · ${empties}`:''}</button>`:''}
 <div class="seg" role="group" aria-label="Ansicht"><button type="button" data-act="mode" data-v="board" aria-pressed="${ui.mode==='board'}">Board</button><button type="button" data-act="mode" data-v="step" aria-pressed="${ui.mode==='step'}">Schritt für Schritt</button></div>
 <button class="btn sm" type="button" data-act="add-group" data-phase="${ph.id}" data-index="${groups.length}">${icon('plus')}Gruppe</button></div>${body}`}
function addTile(phase,index){if(ui.mode==='board'&&!ui.showEmpty&&project.phases[phase].length>0){}const quick=M.TEMPLATES.filter(t=>t.special&&t.phases.includes(phase)).map(t=>`<button class="btn sm" type="button" data-act="tpl-add" data-tpl="${t.id}" data-phase="${phase}" data-index="${index}">${icon('plus')}${esc(t.name)}</button>`).join('');return`<div class="add-tile"><span class="eyebrow">Hinzufügen</span><button class="btn sm primary" type="button" data-act="add-group" data-phase="${phase}" data-index="${index}">${icon('plus')}Gruppe aus Vorlage</button>${quick}<span class="hint">Über ⋯ an einer Gruppe fügst du auch davor oder danach ein.</span></div>`}
function pickTemplate(phase,index){const ph=M.phases.find(x=>x.id===phase);const fit=M.TEMPLATES.filter(t=>t.phases.includes(phase)),rest=M.TEMPLATES.filter(t=>!t.phases.includes(phase)&&t.id!=='empty'),empty=M.TEMPLATES.find(t=>t.id==='empty');

 openDialog(`<div class="dlg-head"><div><div class="eyebrow">${esc(ph.name)}</div><h2>Gruppe hinzufügen</h2></div><button class="icon-btn" type="button" data-close aria-label="Schließen">${icon('x')}</button></div>

 <details><summary class="eyebrow" style="cursor:pointer">Weitere Vorlagen</summary><div class="tpl-grid" style="margin-top:10px">${rest.map(tile).join('')}</div></details>`)}
function groupHtml(g,ph,step=false){const filled=g.cards.filter(c=>M.value(project,c).trim()).length;const col=!step&&ui.collapsed.has(g.id);const q=ui.q.trim().toLowerCase();
 return`<article class="group ${g.kind==='point'?'point':''} ${g.kind==='custom'?'custom':''} ${col?'collapsed':''}" data-group="${g.id}"><div class="g-head"><button class="icon-btn" type="button" data-act="collapse" data-id="${g.id}" aria-label="Ein- oder ausklappen" aria-expanded="${!col}" style="${col?'transform:rotate(-90deg)':''}">${icon('fold')}</button><div style="flex:1;min-width:0"><div class="g-kind">${esc(tplLabel(g)||kindLabel[g.kind]||'Gruppe')}</div><h3 class="g-title" data-group-name="${g.id}">${esc(groupName(g))}</h3></div>${(()=>{const t=g.template&&M.TEMPLATES.find(x=>x.id===g.template);return t&&t.lib?`<button class="icon-btn" type="button" data-act="open-entry" data-id="${t.lib}" title="In der Bibliothek nachlesen" aria-label="In der Bibliothek nachlesen">${icon('book')}</button>`:''})()}<span class="g-count" data-group-count="${g.id}">${filled}/${g.cards.length}</span><button class="icon-btn" type="button" data-act="group-menu" data-id="${g.id}" aria-label="Gruppe bearbeiten">${icon('dots')}</button></div>
 ${(()=>{const show=step||ui.showEmpty||ui.expanded.has(g.id)||!!q;const vis=show?g.cards:g.cards.filter(c=>M.value(project,c).trim());const hid=g.cards.filter(c=>!vis.includes(c));return`<div class="cards">${vis.map(c=>cardHtml(c,g,q)).join('')}</div>${hid.length?`<button class="open-fields" type="button" data-act="expand-group" data-id="${g.id}">${icon('plus')}<span>${hid.length} offene${hid.length===1?'s Feld':' Felder'}: <b>${esc(hid.map(c=>c.title).join(' · '))}</b></span></button>`:''}${ui.expanded.has(g.id)&&!ui.showEmpty&&!step&&g.cards.some(c=>!M.value(project,c).trim())?`<button class="btn sm ghost" type="button" data-act="shrink-group" data-id="${g.id}">Leere einklappen</button>`:''}`})()}
 <div class="g-foot"><button class="btn sm ghost" type="button" data-act="add-card" data-id="${g.id}">${icon('plus')}Post-it</button>${g.kind==='point'?`<button class="btn sm ghost" type="button" data-act="add-arg" data-id="${g.id}">${icon('plus')}Argument</button>`:''}</div></article>`}
function cardHtml(c,g,q){const v=M.value(project,c);const linked=c.source&&!c.detached,detached=c.source&&c.detached;const src=project.sources.filter(s=>s.links.includes(c.id));const notes=project.notes.filter(n=>n.links.includes(c.id));const match=q&&(v.toLowerCase().includes(q)||c.title.toLowerCase().includes(q));
 const from=c.source?M.findCard(project,c.source):null;
 return`<div class="card ${match?'match':''}" data-card="${c.id}" data-color="${esc(legacyColor(c.color))}"><div class="c-head"><label class="c-title" for="c-${c.id}">${esc(c.title)}</label><div class="c-tools"><button class="icon-btn" type="button" data-act="card-menu" data-id="${c.id}" aria-label="Post-it bearbeiten">${icon('dots')}</button></div></div>
 <textarea id="c-${c.id}" data-card-input="${c.id}" data-auto rows="1" placeholder="${esc(c.hint||'Gedanken notieren …')}">${esc(v)}</textarea>
 ${(linked||detached||src.length||notes.length)?`<div class="c-foot">${linked?`<span class="link-badge" title="Übernimmt automatisch: ${esc(from?from.card.title:'')}">${icon('link','ico')}übernommen aus ${esc(from?groupName(from.group):'')}</span>`:''}${detached?`<button class="link-badge off" type="button" data-act="relink" data-id="${c.id}" title="Wieder automatisch übernehmen">eigenständig · neu verknüpfen</button>`:''}${src.map(s=>`<button class="src-badge" type="button" data-nav="recherche" title="${esc(s.title)}">[${project.sources.indexOf(s)+1}] ${esc((s.title||'Quelle').slice(0,28))}</button>`).join('')}${notes.length?`<span class="src-badge">${notes.length} Notiz${notes.length>1?'en':''}</span>`:''}</div>`:''}</div>`}

function vExport(){const blocks=X.build(project,ui.variant,{onlyFilled:ui.onlyFilled,sections:ui.sections});
 const preview=ui.preview==='table'?tablePreview():ui.preview==='text'?`<pre class="panel" style="white-space:pre-wrap;overflow-x:auto;font:.84rem/1.6 var(--f-mono);margin:0">${esc(X.toText(blocks))}</pre>`:`<div class="preview">${X.toHtml(blocks)}</div>`;

function tablePreview(){const rows=allCards().map(x=>[x.ph.name,groupName(x.g),x.c.title,M.value(project,x.c)]).filter(r=>!ui.onlyFilled||r[3].trim());return`<div class="table-wrap"><table class="rtable"><thead><tr><th>Phase</th><th>Gruppe</th><th>Post-it</th><th>Inhalt</th></tr></thead><tbody>${rows.map(r=>`<tr>${r.map(c=>`<td>${esc(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`}
function fileBase(){return(project.title||'Projekt').replace(/[\\/:*?"<>|]+/g,'').replace(/\s+/g,' ').trim().slice(0,80)||'Projekt'}
async function download(name,data){try{const dl=window.claude&&claude.use?await claude.use('downloads'):null;if(dl){try{await dl.save({filename:name,data:new Blob([data])});toast('Datei gespeichert: '+name)}catch(e){if(e&&e.code==='declined')return;toast('Speichern nicht möglich ('+(e&&e.code||'Fehler')+').')}return}}catch{}
 const url=URL.createObjectURL(new Blob([data]));const a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),4000);toast('Datei erstellt: '+name)}
function doExport(f){const blocks=X.build(project,ui.variant,{onlyFilled:ui.onlyFilled,sections:ui.sections});const base=fileBase()+(ui.variant==='dossier'?'':' – '+X.VARIANTS[ui.variant].name);
 if(f==='docx')return download(base+'.docx',X.toDocx(blocks,project.title));if(f==='pdf')return download(base+'.pdf',X.toPdf(blocks,project.title));if(f==='md')return download(base+'.md',X.toMarkdown(blocks));if(f==='txt')return download(base+'.txt',X.toText(blocks));if(f==='csv')return download(fileBase()+'.csv',X.toCsv(project));if(f==='json')return download(fileBase()+'.json',JSON.stringify({app:'content-werkstatt',version:3,project},null,2))}
function backupAll(){const stamp=new Date().toISOString().slice(0,10);download(`Content-Werkstatt-Sicherung-${stamp}.json`,JSON.stringify({app:'content-werkstatt',version:3,exported:new Date().toISOString(),projects:data.projects,trash:data.trash},null,2))}
async function importFile(file){try{if(file.size>30e6)throw Error('groß');const raw=JSON.parse(await file.text());let list=[];
 if(Array.isArray(raw.projects))list=raw.projects;else if(raw.project&&[1,2,3].includes(raw.version))list=[raw.project];else throw Error('Format');
 const imported=list.map(p=>{const m=normalize(p);if(!M.validate(m))throw Error('ungültig');return m});

 for(const p of imported)if(p.folder)p.folder=fmap[p.folder]||(data.folders.some(x=>x.id===p.folder)?p.folder:'');

function refreshLinked(src){$$('[data-card-input]').forEach(el=>{if(el===src)return;const f=M.findCard(project,el.dataset.cardInput);if(!f)return;const v=M.value(project,f.card);if(el.value!==v){el.value=v;autosize(el)}});$$('[data-group-count]').forEach(el=>{const g=M.findGroup(project,el.dataset.groupCount)?.group;if(g)el.textContent=g.cards.filter(c=>M.value(project,c).trim()).length+'/'+g.cards.length});$$('[data-group-name]').forEach(el=>{const g=M.findGroup(project,el.dataset.groupName)?.group;if(g)el.textContent=groupName(g)})}
document.addEventListener('change',e=>{const t=e.target;
 if(t.dataset.cardInput&&t.dataset.sync){delete t.dataset.sync;const f=M.findCard(project,t.dataset.cardInput);const before=project.phases.body.length;edit('',()=>M.syncKeys(project,f.card));if(project.phases.body.length!==before){render();toast('Neue Schlüsselpunkte wurden als Hauptpunkte übernommen')}else refreshLinked(t);return}
 if(t.dataset.actChange==='project-folder'){const p=data.projects.find(x=>x.id===t.dataset.id);if(t.value==='__new'){newFolder(p);return}moveToFolder(p,t.value);return}
 if(t.dataset.actChange==='link-src'&&t.value){const s=project.sources.find(x=>x.id===t.dataset.id);mutate(()=>{if(!s.links.includes(t.value))s.links.push(t.value)},'Zugeordnet');return}
 if(t.dataset.noteId&&t.tagName==='SELECT'){render();return}
 if(t.dataset.src&&t.tagName==='SELECT')return;
 if(t.dataset.bind==='format'||t.dataset.bind==='deadline')render()});
document.addEventListener('submit',e=>{const f=e.target;if(f.dataset.form==='add-item'){e.preventDefault();const v=f.text.value.trim();if(!v)return;const kind=f.dataset.kind;mutate(()=>project[kind].push({id:M.uid(),text:v,done:false,answer:'',due:''}));setTimeout(()=>$('#add-'+kind)?.focus(),10)}});
document.addEventListener('keydown',e=>{const t=e.target;
 if(t.dataset&&t.dataset.tagInput!==undefined&&(e.key==='Enter'||e.key===',')){e.preventDefault();const v=t.value.trim().replace(/^#/,'');if(!v)return;const s=t.dataset.tagInput,id=t.dataset.id;mutate(()=>{const o=s==='project'?project:s==='note'?project.notes.find(n=>n.id===id):project.sources.find(x=>x.id===id);if(!o.tags.includes(v))o.tags.push(v)});setTimeout(()=>$('#'+t.id)?.focus(),10);return}
 if(e.key==='Escape'){closeMenu()}
 const typing=/INPUT|TEXTAREA|SELECT/.test(t.tagName);
 if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='z'&&!typing){e.preventDefault();undo(e.shiftKey);return}
 if(!typing&&!dlg.open&&$('#present').hidden&&!e.metaKey&&!e.ctrlKey&&!e.altKey&&e.key.toLowerCase()==='n'){e.preventDefault();quickNote()}});
$('#undo').onclick=()=>undo(false);$('#redo').onclick=()=>undo(true);$('#quickNote').onclick=quickNote;$('#goExport').onclick=()=>go('export');
$('#importFile').onchange=e=>{const f=e.target.files[0];if(f)importFile(f);e.target.value=''};$('#themeBtn').onclick=toggleTheme;applyTheme();
window.addEventListener('hashchange',()=>{const v=location.hash.slice(1);if(VIEWS[v]&&v!==ui.view){ui.view=v;render()}});
{const h=location.hash.slice(1);ui.view=VIEWS[h]?h:'start'}
render();
if(loaded.legacy)toast('Deine bisherigen Roadmaps wurden übernommen.');
initCloud();

</script>
</body>
</html>
